name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install ruff==0.16.8
          ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax check
        run: find poker/static/js root/static/js -name "*.js" -print0 | xargs -0 -n1 node --check

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://poker:poker@localhost:5432/poker_test
      TEST_DATABASE_URL: postgresql://poker:poker@localhost:5432/poker_test
      SESSION_SECRET_KEY: ci-only-secret
      APP_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      # 检查模型和迁移是否一致；先只报告、不阻断，等确认现有差异后再改成必须通过
      - name: Check models match migrations
        run: alembic check
        continue-on-error: true

      - name: Run tests
        run: pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只报告已知漏洞、不让检查变红：Render 设成“CI 通过后再部署”时，
      # 任何一项检查失败都会挡住部署。漏洞清单写进本次运行的 Summary 页面。
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          set -o pipefail
          {
            echo "## Dependency audit"
            echo
            echo '```'
            pip-audit -r requirements.txt 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
