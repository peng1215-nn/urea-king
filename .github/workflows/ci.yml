name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install ruff==0.16.8
          ruff check .

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: JavaScript syntax check
        run: find poker/static/js root/static/js -name "*.js" -print0 | xargs -0 -n1 node --check

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://poker:poker@localhost:5432/poker_test
      TEST_DATABASE_URL: postgresql://poker:poker@localhost:5432/poker_test
      SESSION_SECRET_KEY: ci-only-secret
      APP_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      # 检查模型和迁移是否一致；先只报告、不阻断，等确认现有差异后再改成必须通过
      - name: Check models match migrations
        run: alembic check
        continue-on-error: true

      - name: Run tests
        run: |
          set -o pipefail
          pytest -rfE 2>&1 | tee pytest.log

      # 把失败的用例名和断言信息作为注释显示在检查结果上，不用翻完整日志
      - name: Report failed tests
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          {
            echo "## Failed tests"
            echo '```'
            grep -E "^(FAILED|ERROR) |^E  " pytest.log | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # 依赖有已知漏洞时让检查失败（Render 设成"CI 通过后再部署"，所以有漏洞时不会上线）。
      # 如果某个漏洞暂时没有修复版本、又必须上线，把它的编号写进 .github/pip-audit-ignore.txt
      # （每行一个，如 GHSA-xxxx-xxxx-xxxx），并在旁边注明原因。
      - name: pip-audit
        run: |
          pip install pip-audit==2.9.0
          ignore_args=""
          if [ -f .github/pip-audit-ignore.txt ]; then
            for id in $(grep -vE '^\s*(#|$)' .github/pip-audit-ignore.txt | awk '{print $1}'); do
              ignore_args="$ignore_args --ignore-vuln $id"
            done
          fi
          set -o pipefail
          {
            echo "## Dependency audit"
            echo
            echo '```'
            pip-audit -r requirements.txt $ignore_args 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
