<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>UREAKING 注册</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background-image: url("/static/images/login_background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .sidebar {
            position: fixed;
            left: -190px;
            top: 0;
            width: 220px;
            height: 100vh;
            background: rgba(15, 15, 25, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: left 0.3s ease;
            z-index: 2;
            border-right: 1px solid rgba(255, 255, 255, 0.18);
        }

        .sidebar:hover {
            left: 0;
        }

        .sidebar-title {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
        }

        .sidebar:hover .sidebar-title {
            writing-mode: horizontal-tb;
        }

        .register-card {
            width: 420px;
            max-height: 88vh;
            padding: 38px;
            border-radius: 18px;
            background: rgba(10, 10, 18, 0.88);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
        }

        .register-card::-webkit-scrollbar {
            width: 6px;
        }

        .register-card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px;
        }

        .register-card::-webkit-scrollbar-track {
            background: transparent;
        }

        .title-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .title-area h1 {
            font-size: 40px;
            letter-spacing: 4px;
        }

        .title-area p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.82);
        }

        input {
            height: 44px;
            border: none;
            border-radius: 10px;
            padding: 0 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.92);
            color: #111;
            font-size: 14px;
        }

        #message-box {
            min-height: 22px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            margin-top: -4px;
        }

        .register-button {
            height: 46px;
            border: none;
            border-radius: 10px;
            margin-top: 8px;
            background: white;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .register-button:hover {
            background: #dcdcdc;
            transform: translateY(-1px);
        }

        .bottom-links {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            font-size: 13px;
        }

        .bottom-links a {
            color: rgba(255, 255, 255, 0.78);
            text-decoration: none;
            cursor: pointer;
        }

        .bottom-links a:hover {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
    <div class="register-card">

        <div class="title-area">
            <h1>UREAKING</h1>
            <p>8th-Ecosystem</p>
        </div>

        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>

        <div class="form-group">
            <label for="nickname">昵称</label>
            <input type="text" id="nickname" placeholder="请输入昵称">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>

        <div class="form-group">
            <label for="confirm-password">确认密码</label>
            <input type="password" id="confirm-password" placeholder="请再次输入密码">
        </div>

        <div class="form-group">
            <label for="invite-code">邀请码</label>
            <input type="text" id="invite-code" placeholder="请输入邀请码">
        </div>

        <div id="message-box"></div>

        <button class="register-button" onclick="register()">
            注册账号
        </button>

        <div class="bottom-links">
            <a href="/login">返回登录</a>
        </div>

    </div>
</div>

<script>
    function showMessage(message, success = false) {
        const box = document.getElementById("message-box");

        box.innerText = message;

        if (success) {
            box.style.color = "#5CFFB2";
        } else {
            box.style.color = "#FF6B6B";
        }
    }

    async function register() {
        const username = document.getElementById("username").value.trim();
        const nickname = document.getElementById("nickname").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;
        const inviteCode = document.getElementById("invite-code").value.trim();

        const usernamePattern = /^[A-Za-z][A-Za-z0-9_]{4,}$/;

        if (!usernamePattern.test(username)) {
            showMessage("用户名必须以字母开头，且至少 5 位，只能包含字母、数字和下划线。");
            return;
        }

        if (nickname.length === 0) {
            showMessage("昵称不能为空。");
            return;
        }

        if (password.length < 6) {
            showMessage("密码长度必须大于等于 6 位。");
            return;
        }

        if (password !== confirmPassword) {
            showMessage("两次输入的密码不一致。");
            return;
        }

        if (inviteCode.length === 0) {
            showMessage("请输入邀请码。");
            return;
        }

        const formData = new FormData();

        formData.append("username", username);
        formData.append("nickname", nickname);
        formData.append("password", password);
        formData.append("confirm_password", confirmPassword);
        formData.append("invite_code", inviteCode);

        const response = await fetch("/register", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        showMessage(data.message, data.success);

        if (data.success) {
            setTimeout(() => {
                window.location.href = "/login";
            }, 1200);
        }
    }
</script>

</body>
</html>
