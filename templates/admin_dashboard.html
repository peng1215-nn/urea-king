<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>控制面板</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;
            background: linear-gradient(135deg, #0f0f16, #151928, #1a2033);
            display: flex;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            padding: 28px 18px;
            background: rgba(10, 10, 18, 0.96);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 42px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item {
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.82);
            cursor: pointer;
            transition: 0.25s;
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main {
            flex: 1;
            padding: 38px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 34px;
        }

        .title-area h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .title-area p {
            color: rgba(255, 255, 255, 0.68);
            letter-spacing: 1px;
        }

        .admin-tag {
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(92, 255, 178, 0.15);
            color: #5CFFB2;
            font-weight: bold;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #5CFFB2;
            margin-right: 8px;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 42px;
        }

        .stat-card {
            width: 230px;
            padding: 24px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }

        .stat-title {
            color: rgba(255, 255, 255, 0.68);
            margin-bottom: 12px;
            font-size: 14px;
        }

        .stat-value {
            font-size: 34px;
            font-weight: bold;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .modules {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .module-card {
            width: 285px;
            min-height: 165px;
            padding: 24px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: 0.25s;
        }

        .module-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.075);
        }

        .module-card h2 {
            font-size: 21px;
            margin-bottom: 14px;
        }

        .module-card p {
            line-height: 1.6;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="logo">UREAKING</div>

    <div class="menu">
        <div class="menu-item">系统监控</div>
        <div class="menu-item">用户管理</div>
        <div class="menu-item">邀请码管理</div>
        <div class="menu-item">系统日志</div>
        <div class="menu-item">公告管理</div>
        <div class="menu-item">修改密码</div>
        <div class="menu-item" onclick="logout()">退出登录</div>
    </div>

</div>

<div class="main">

    <div class="top-bar">
        <div class="title-area">
            <h1>控制面板</h1>
            <p>8th-Ecosystem</p>
        </div>

        <div class="admin-tag">
            <span class="status-dot"></span>
            管理员
        </div>
    </div>

   <div class="stats">

    <div class="stat-card">
        <div class="stat-title">总用户数</div>
        <div class="stat-value" id="total-users">--</div>
    </div>

    <div class="stat-card">
        <div class="stat-title">管理员数量</div>
        <div class="stat-value" id="admin-count">--</div>
    </div>

    <div class="stat-card">
        <div class="stat-title">局头数量</div>
        <div class="stat-value" id="organizer-count">--</div>
    </div>

    <div class="stat-card">
        <div class="stat-title">未使用邀请码</div>
        <div class="stat-value" id="unused-invite-count">--</div>
    </div>

</div>

    <h2 class="section-title">管理模块</h2>

<div class="modules">

    <div class="module-card">
        <h2>系统监控</h2>
        <p>查看系统运行状态、用户活跃情况与整体生态数据。</p>
    </div>

    <div class="module-card">
        <h2>用户管理</h2>
        <p>查看用户信息、维护身份权限、组别归属与账号状态。</p>
    </div>

    <div class="module-card">
        <h2>邀请码管理</h2>
        <p>生成邀请码并绑定身份与组别，控制系统注册来源。</p>
    </div>

    <div class="module-card">
        <h2>系统日志</h2>
        <p>查看登录、注册、邀请码使用与权限变更等系统记录。</p>
    </div>

    <div class="module-card">
        <h2>公告管理</h2>
        <p>发布系统公告、活动通知与生态规则相关说明内容。</p>
    </div>

    <div class="module-card">
        <h2>修改密码</h2>
        <p>修改当前管理员账户密码并提升系统账号安全性。</p>
    </div>

</div>

<script>
    async function loadAdminStats() {
        try {
            const response = await fetch("/admin/stats");
            const data = await response.json();

            if (!data.success) {
                return;
            }

            document.getElementById("total-users").innerText =
                data.total_users;

            document.getElementById("admin-count").innerText =
                data.admin_count;

            document.getElementById("organizer-count").innerText =
                data.organizer_count;

            document.getElementById("unused-invite-count").innerText =
                data.unused_invitation_codes;

        } catch (error) {
            console.error("加载管理员统计数据失败：", error);
        }
    }


    function logout() {
        window.location.href = "/logout";
    }

    loadAdminStats();
</script>
</div>

</body>
</html>
