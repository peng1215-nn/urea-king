<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <title data-i18n="gameManagement">牌局管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/common/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/admin/user_management.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/organizer/game_management.css?v={{ static_version }}">

</head>

<body>

{% include "organizer/sidebar.html" %}

<div class="main">

    <div class="top-bar">

        <div class="title-area">
            <h1 data-i18n="gameManagement">牌局管理</h1>
            <p id="current-group-text"></p>
        </div>

        <div class="topbar-actions">

            <img
                id="avatar-preview"
                class="avatar"
                src="/static/images/default_avatar.jpg"
                alt="头像"
            >

            <div class="role-tag">
                <span class="status-dot"></span>
                <span data-i18n="organizer">局头</span>
            </div>

        </div>

    </div>

    <div id="no-game-section">

        <div class="game-empty-card">

            <div class="game-empty-icon">
                <i class="fa-solid fa-dice"></i>
            </div>

            <h2 data-i18n="noOngoingGame">当前没有进行中的牌局</h2>

            <p data-i18n="noOngoingGameDesc">点击下方按钮开始一场新的牌局</p>

            <button
                class="start-game-button"
                onclick="openStartGameModal()"
                data-i18n="startGame"
            >
                开局
            </button>

        </div>

    </div>

    <div id="ongoing-game-section" style="display:none;">

        <div class="game-tabs-bar">
            <div id="game-tabs" class="game-tabs"></div>
            <button
                class="btn-start-new-game"
                onclick="openStartGameModal()"
                data-i18n="startGame"
            >
                <i class="fa-solid fa-plus"></i>
                <span data-i18n="startGame">开局</span>
            </button>
        </div>

        <div class="game-status-bar">

            <div class="game-status-info">

                <div class="game-status-badge ongoing">
                    <span class="status-dot-blue"></span>
                    <span data-i18n="statusOngoing">进行中</span>
                </div>

                <div class="game-meta">
                    <span data-i18n="startedAt">开局时间：</span>
                    <span id="game-started-at">--</span>
                </div>

                <div class="game-meta">
                    <span data-i18n="playerCount">在局人数：</span>
                    <span id="game-player-count">0</span>
                    <span> / 10</span>
                </div>

            </div>

            <button
                class="finish-game-button"
                onclick="openFinishGameModal()"
                data-i18n="finishGame"
            >
                结束牌局
            </button>

        </div>

        <div class="game-panels">

            <div class="game-panel">

                <div class="panel-header">
                    <div class="panel-header-left">
                        <i class="fa-solid fa-users"></i>
                        <h2 data-i18n="playersInGame">当前玩家</h2>
                    </div>
                    <button
                        class="add-player-btn"
                        onclick="openAddPlayerModal()"
                    >
                        <i class="fa-solid fa-plus"></i>
                        <span data-i18n="addPlayer">加入玩家</span>
                    </button>
                </div>

                <div id="player-list" class="player-list"></div>

            </div>

            <div class="game-panel">

                <div class="panel-header">
                    <div class="panel-header-left">
                        <i class="fa-solid fa-coins"></i>
                        <h2 data-i18n="chipRequestsPending">待审批筹码请求</h2>
                    </div>
                </div>

                <div id="request-list" class="request-list"></div>

            </div>

        </div>

        <div id="game-message" class="game-message"></div>

    </div>

</div>

<div id="start-game-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content modal-wide">

        <h3 data-i18n="startGame">开局</h3>

        <p class="modal-desc" data-i18n="startGameDesc">
            预选参与本局玩家，最多 9 人。
        </p>

        <div class="form-group" style="margin-bottom: 16px;">
            <label data-i18n="gameName">牌局名称</label>
            <input
                type="text"
                id="start-game-name"
                class="modal-input"
                maxlength="50"
                data-i18n-placeholder="gameNamePlaceholder"
                placeholder="请输入牌局名称"
            >
        </div>

        <div class="preselect-area">
            <div class="preselect-label" data-i18n="selectPlayers">选择参与玩家</div>
            <div id="member-select-list" class="member-select-list"></div>
        </div>

        <div class="modal-selected-info">
            <span data-i18n="selectedCount">已选：</span>
            <span id="selected-count">0</span>
            <span> / 10</span>
        </div>

        <div id="start-game-message" class="operation-message"></div>

        <div class="custom-modal-actions">
            <button class="modal-confirm-button" onclick="confirmStartGame()" data-i18n="confirmStartGame">确认开局</button>
            <button class="modal-cancel-button" onclick="closeStartGameModal()" data-i18n="cancel">取消</button>
        </div>

    </div>
</div>

<div id="add-player-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content modal-wide">

        <h3 data-i18n="addPlayer">加入玩家</h3>

        <div id="add-player-select-list" class="member-select-list single-select"></div>

        <div id="add-player-message" class="operation-message"></div>

        <div class="custom-modal-actions">
            <button class="modal-confirm-button" onclick="confirmAddPlayer()" data-i18n="confirm">确认</button>
            <button class="modal-cancel-button" onclick="closeAddPlayerModal()" data-i18n="cancel">取消</button>
        </div>

    </div>
</div>

<div id="finish-game-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content modal-wide">

        <h3 data-i18n="finishGame">结束牌局</h3>

        <p class="modal-desc" data-i18n="finishGameDesc">
            请填写每位玩家的卖出筹码数额，由局头统一确认。
        </p>

        <div id="finish-cashout-list" class="finish-player-list"></div>

        <div id="finish-message" class="operation-message"></div>

        <div class="custom-modal-actions">
            <button class="modal-confirm-button" id="finish-confirm-btn" onclick="confirmFinishGame()" data-i18n="finishAndCheck">结束并校验</button>
            <button class="modal-cancel-button" onclick="closeFinishGameModal()" data-i18n="cancel">取消</button>
        </div>

    </div>
</div>

<div id="organizer-buyin-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">

        <h3 data-i18n="buyInChips">买入筹码</h3>

        <p class="modal-desc" data-i18n="organizerBuyinDesc">局头直接买入，无需审批。</p>

        <div class="form-group" style="margin-bottom:16px;">
            <label data-i18n="buyInType">买入类型</label>
            <select id="organizer-buyin-type" class="modal-select">
                <option value="normal" data-i18n="buyInNormal">普通买入</option>
                <option value="insurance" data-i18n="buyInInsurance">保险买入</option>
                <option value="anti" data-i18n="buyInAnti">Anti 买入</option>
            </select>
        </div>

        <div class="form-group">
            <label data-i18n="amount">金额</label>
            <input
                type="number"
                id="organizer-buyin-amount"
                class="modal-input"
                min="1"
                data-i18n-placeholder="organizerBuyinPlaceholder"
                placeholder="请输入买入数额"
            >
        </div>

        <div id="organizer-buyin-message" class="operation-message"></div>

        <div class="custom-modal-actions">
            <button class="modal-confirm-button" onclick="confirmOrganizerBuyin()" data-i18n="confirm">确认</button>
            <button class="modal-cancel-button" onclick="closeOrganizerBuyinModal()" data-i18n="cancel">取消</button>
        </div>

    </div>
</div>

<div id="settlement-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content modal-wide">

        <div class="settlement-header">
            <i class="fa-solid fa-circle-check settlement-success-icon"></i>
            <h3 data-i18n="settlementSuccess">校验成功，牌局已结束</h3>
        </div>

        <div class="settlement-summary">
            <span data-i18n="totalBuyIn">总买入</span>：<strong id="settle-total-buyin">--</strong>
            &nbsp;&nbsp;
            <span data-i18n="totalCashOut">总剩余</span>：<strong id="settle-total-cashout">--</strong>
        </div>

        <div id="settlement-player-list" class="settlement-player-list"></div>

        <div class="custom-modal-actions">
            <button class="modal-confirm-button" onclick="closeSettlementModal()" data-i18n="confirm">确认</button>
        </div>

    </div>
</div>

<div id="join-group-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">
        <h3 data-i18n="joinOtherGroup">加入其他组</h3>
        <p data-i18n="joinGroupLogoutConfirm">此操作会退出当前登录，是否确认？</p>
        <div class="custom-modal-actions">
            <button class="modal-confirm-button" data-i18n="confirm" onclick="confirmJoinGroup()">确认</button>
            <button class="modal-cancel-button" data-i18n="cancel" onclick="closeJoinGroupModal()">取消</button>
        </div>
    </div>
</div>

<script src="/static/js/organizer/dashboard/group_join.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/organizer.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/current_user.js?v={{ static_version }}"></script>
<script src="/static/js/common/logout.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/game_management/state.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/game_management/game_api.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/game_management/game_render.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/game_management/start_game.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/game_management/player_actions.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/game_management/finish_game.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/game_management/init.js?v={{ static_version }}"></script>

</body>
</html>
