<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <title>UREAKING Login</title>

    <link rel="stylesheet" href="/static/css/auth/common.css">
    <link rel="stylesheet" href="/static/css/auth/login.css">

</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">
        Ureaking
    </div>
</div>

<div class="page">

    <div class="login-card">

        <div class="title-area">
            <h1>UREAKING</h1>
            <p>8th-Ecosystem</p>
        </div>

        <div id="message-box" class="message-box"></div>

        <div class="form-group">

            <label for="username">
                用户名
            </label>

            <input
                    type="text"
                    id="username"
                    placeholder="请输入用户名"
            >

        </div>

        <div class="form-group">

            <label for="password">
                密码
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="请输入密码"
            >

        </div>

        <button class="login-button" onclick="login()">
            登录
        </button>

        <div class="text-links">

            <a href="/register">
                注册账号
            </a>

            <a onclick="forgotPassword()">
                忘记密码
            </a>

        </div>

    </div>

</div>

<script src="/static/js/auth/login/message.js"></script>
<script src="/static/js/auth/login/form.js"></script>
<script src="/static/js/auth/login/redirect.js"></script>
<script src="/static/js/auth/login/login.js"></script>
<script src="/static/js/auth/login/forgot_password.js"></script>
<script src="/static/js/auth/login/init.js"></script>

</body>
</html>
