<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <title>UREAKING Group Join</title>

    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/group_join.css?v={{ static_version }}">

</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">

    <div class="group-join-card">

        <div class="title-area">
            <h1>UREAKING</h1>
            <p>8th-Ecosystem</p>
        </div>

        <div class="form-group">
            <label for="username" data-i18n="username">用户名</label>

            <input
                type="text"
                id="username"
                placeholder="请输入用户名"
                data-i18n-placeholder="enterUsername"
            >
        </div>

        <div class="form-group">
            <label for="password" data-i18n="password">密码</label>

            <input
                type="password"
                id="password"
                placeholder="请输入密码"
                data-i18n-placeholder="enterPassword"
            >
        </div>

        <div class="form-group">
            <label for="invite-code" data-i18n="inviteCode">邀请码</label>

            <input
                type="text"
                id="invite-code"
                placeholder="请输入邀请码"
                data-i18n-placeholder="enterInviteCode"
            >
        </div>

        <div id="message-box"></div>

        <button
            class="group-join-button"
            onclick="groupJoin()"
            data-i18n="groupJoinSubmit"
        >
            加入组
        </button>

        <div class="bottom-links">
            <a href="/login" data-i18n="backToLogin">
                返回登录
            </a>
        </div>

    </div>

</div>

<script src="/static/js/i18n/login.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/auth/group_join/group_join.js?v={{ static_version }}"></script>

</body>
</html>
