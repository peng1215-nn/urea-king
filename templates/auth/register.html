<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <title>UREAKING 注册</title>

    <link rel="stylesheet" href="/static/css/auth/common.css">
    <link rel="stylesheet" href="/static/css/auth/register.css">

</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
    <div class="register-card">

        <div class="title-area">
            <h1>UREAKING</h1>
            <p>8th-Ecosystem</p>
        </div>

        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>

        <div class="form-group">
            <label for="nickname">昵称</label>
            <input type="text" id="nickname" placeholder="请输入昵称">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>

        <div class="form-group">
            <label for="confirm-password">确认密码</label>
            <input type="password" id="confirm-password" placeholder="请再次输入密码">
        </div>

        <div class="form-group">
            <label for="invite-code">邀请码</label>
            <input type="text" id="invite-code" placeholder="请输入邀请码">
        </div>

        <div id="message-box"></div>

        <button class="register-button" onclick="register()">
            注册账号
        </button>

        <div class="bottom-links">
            <a href="/login">返回登录</a>
        </div>

    </div>
</div>

<script src="/static/js/auth/register/message.js"></script>
<script src="/static/js/auth/register/form.js"></script>
<script src="/static/js/auth/register/redirect.js"></script>
<script src="/static/js/auth/register/register.js"></script>
<script src="/static/js/auth/register/init.js"></script>

</body>
</html>
