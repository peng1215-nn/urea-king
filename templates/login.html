<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>UREAKING Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background-image:
                    url("/static/images/login_background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;

            overflow: hidden;
        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:
                    rgba(0, 0, 0, 0.55);

            z-index: 0;
        }

        .page {

            position: relative;

            z-index: 1;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .sidebar {

            position: fixed;

            left: -190px;

            top: 0;

            width: 220px;

            height: 100vh;

            background:
                    rgba(15, 15, 25, 0.88);

            backdrop-filter: blur(8px);

            display: flex;

            justify-content: center;

            align-items: center;

            transition: left 0.3s ease;

            z-index: 2;

            border-right:
                    1px solid rgba(255, 255, 255, 0.18);
        }

        .sidebar:hover {
            left: 0;
        }

        .sidebar-title {

            font-size: 26px;

            font-weight: bold;

            letter-spacing: 2px;

            writing-mode: vertical-rl;
        }

        .sidebar:hover .sidebar-title {
            writing-mode: horizontal-tb;
        }

        .login-card {

            width: 380px;

            padding: 36px;

            border-radius: 18px;

            background:
                    rgba(10, 10, 18, 0.75);

            backdrop-filter: blur(12px);

            box-shadow:
                    0 20px 45px rgba(0, 0, 0, 0.45);

            display: flex;

            flex-direction: column;

            gap: 18px;
        }

        .title-area {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            margin-bottom: 12px;
        }

        .title-area h1 {

            font-size: 42px;

            letter-spacing: 4px;
        }

        .title-area p {

            font-size: 15px;

            color:
                    rgba(255, 255, 255, 0.75);

            letter-spacing: 1px;
        }

        .form-group {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        label {

            font-size: 14px;

            color:
                    rgba(255, 255, 255, 0.82);
        }

        input,
        select {

            height: 42px;

            border: none;

            border-radius: 10px;

            padding: 0 14px;

            outline: none;

            background:
                    rgba(255, 255, 255, 0.92);

            color: #111;

            font-size: 14px;
        }

        .login-button {

            height: 44px;

            border: none;

            border-radius: 10px;

            margin-top: 8px;

            background: white;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .login-button:hover {

            background: #dcdcdc;

            transform: translateY(-1px);
        }

        .text-links {

            display: flex;

            justify-content: space-between;

            margin-top: 8px;

            font-size: 13px;
        }

        .text-links a {

            color:
                    rgba(255, 255, 255, 0.78);

            text-decoration: none;

            cursor: pointer;
        }

        .text-links a:hover {

            color: white;

            text-decoration: underline;
        }

        .message-box {

            display: none;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 14px;

            text-align: center;

            margin-top: 4px;
        }

        .success-message {

            background:
                    rgba(92, 255, 178, 0.15);

            color: #5CFFB2;
        }

        .error-message {

            background:
                    rgba(255, 90, 90, 0.15);

            color: #ff8a8a;
        }

    </style>
</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">
        Ureaking
    </div>
</div>

<div class="page">

    <div class="login-card">

        <div class="title-area">
            <h1>UREAKING</h1>
            <p>8th-Ecosystem</p>
        </div>

        <div id="message-box" class="message-box"></div>

        <div class="form-group">

            <label for="role">
                身份权限
            </label>

            <select id="role">

                <option value="user">
                    普通用户
                </option>

                <option value="organizer">
                    局头
                </option>

                <option value="admin">
                    管理员
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="username">
                用户名
            </label>

            <input
                    type="text"
                    id="username"
                    placeholder="请输入用户名"
            >

        </div>

        <div class="form-group">

            <label for="password">
                密码
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="请输入密码"
            >

        </div>

        <button class="login-button" onclick="login()">
            登录
        </button>

        <div class="text-links">

            <a href="/register">
                注册账号
            </a>

            <a onclick="forgotPassword()">
                忘记密码
            </a>

        </div>

    </div>

</div>

<script>

    function showMessage(message, success = false) {

        const box =
            document.getElementById("message-box");

        box.innerText = message;

        box.style.display = "block";

        if (success) {

            box.className =
                "message-box success-message";
        }

        else {

            box.className =
                "message-box error-message";
        }
    }

    async function login() {

        const role =
            document.getElementById("role").value;

        const username =
            document.getElementById("username")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;

        if (!role) {

            showMessage(
                "请选择身份权限。"
            );

            return;
        }

        if (username.length === 0) {

            showMessage(
                "请输入用户名。"
            );

            return;
        }

        if (password.length === 0) {

            showMessage(
                "请输入密码。"
            );

            return;
        }

        const formData = new FormData();

        formData.append(
            "role",
            role
        );

        formData.append(
            "username",
            username
        );

        formData.append(
            "password",
            password
        );

        try {

            const response =
                await fetch(
                    "/login",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            showMessage(
                data.message,
                data.success
            );

            if (
                data.success &&
                data.role === "admin"
            ) {

                setTimeout(() => {

                    window.location.href =
                        "/admin-dashboard";

                }, 5000);
            }

        }

        catch(error) {

            console.error(error);

            showMessage(
                "登录请求失败。"
            );
        }
    }

    function forgotPassword() {

        showMessage(
            "密码找回功能暂未开放。"
        );
    }

</script>

</body>
</html>
