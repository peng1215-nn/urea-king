<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>系统监控</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            color: white;
            background: linear-gradient(135deg, #0f0f16, #151928, #1a2033);
            display: flex;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            padding: 28px 18px;
            background: rgba(10, 10, 18, 0.96);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 42px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item {
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.82);
            cursor: pointer;
            transition: 0.25s;
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .main {
            flex: 1;
            padding: 38px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 34px;
        }

        .title-area h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .title-area p {
            color: rgba(255, 255, 255, 0.68);
            letter-spacing: 1px;
        }

        .admin-tag {
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(92, 255, 178, 0.15);
            color: #5CFFB2;
            font-weight: bold;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #5CFFB2;
            margin-right: 8px;
        }

        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .monitor-card {
            min-height: 170px;
            padding: 26px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
        }

        .monitor-card h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }

        .monitor-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .monitor-description {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.68);
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="logo">UREAKING</div>

    <div class="menu">

        <div class="menu-item active" onclick="window.location.href='/admin-dashboard'">
            系统监控
        </div>

        <div class="menu-item">
            用户管理
        </div>

        <div class="menu-item">
            邀请码管理
        </div>

        <div class="menu-item">
            系统日志
        </div>

        <div class="menu-item">
            公告管理
        </div>

        <div class="menu-item">
            修改密码
        </div>

        <div class="menu-item" onclick="logout()">
            退出登录
        </div>

    </div>

</div>

<div class="main">

    <div class="top-bar">

        <div class="title-area">
            <h1>系统监控</h1>
            <p>8th-Ecosystem</p>
        </div>

        <div class="admin-tag">
            <span class="status-dot"></span>
            管理员
        </div>

    </div>

    <div class="monitor-grid">

        <div class="monitor-card" >
            <h2>服务运行总时长</h2>
            <div class="monitor-value" id="service-uptime">--</div>
            <p class="monitor-description">
                显示当前后端服务自最近一次启动以来的持续运行时间。
            </p>
        </div>

        <div class="monitor-card">
            <h2>数据库连接状态</h2>
            <div class="monitor-value" id="database-status">--</div>
            <p class="monitor-description">
                显示系统当前是否能够正常连接并访问数据库。
            </p>
        </div>

        <div class="monitor-card">
            <h2>部署环境</h2>
            <div class="monitor-value" id="deploy-environment">--</div>
            <p class="monitor-description">
                显示当前系统运行环境，例如 Development 或 Production。
            </p>
        </div>

        <div class="monitor-card">
            <h2>系统版本</h2>
            <div class="monitor-value" id="system-version">v0.1.0</div>
            <p class="monitor-description">
                当前后台系统版本，用于后续功能迭代和版本管理。
            </p>
        </div>

    </div>

</div>

<script>
    function formatRuntime(seconds) {
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;

        return `${days}天 ${hours}小时 ${minutes}分钟 ${secs}秒`;
    }

    async function loadSystemMonitor() {
        const response = await fetch("/admin/system-monitor");
        const data = await response.json();

        if (!data.success) {
            return;
        }

        document.getElementById("service-uptime").innerText =
            formatRuntime(data.total_runtime_seconds);

        document.getElementById("database-status").innerText =
            data.database_status;

        document.getElementById("deploy-environment").innerText =
            data.deploy_environment;

        document.getElementById("system-version").innerText =
            data.system_version;
    }

    function logout() {
        window.location.href = "/logout";
    }

    loadSystemMonitor();

    setInterval(loadSystemMonitor, 1000);
</script>

</body>
</html>
