<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <title>系统监控</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/admin/common.css">
    <link rel="stylesheet" href="/static/css/admin/system_monitor.css">

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main">

    <div class="top-bar">

        <div class="title-area">
            <h1>系统监控</h1>
            <p>8th-Ecosystem</p>
        </div>

        <div class="admin-area">

            <img
                id="avatar-preview"
                class="avatar"
                src="https://via.placeholder.com/96"
                alt="头像"
            >

            <div class="admin-tag">
                <span class="status-dot"></span>
                管理员
            </div>

        </div>

    </div>

    <div class="monitor-grid">

        <div class="monitor-card">
            <div class="monitor-title">
                <div class="monitor-icon">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <h2>服务运行总时长</h2>
            </div>

            <div class="monitor-value" id="service-uptime">--</div>

            <p class="monitor-description">
                显示网站自设定上线时间以来的总运行时长。
            </p>
        </div>

        <div class="monitor-card">
            <div class="monitor-title">
                <div class="monitor-icon green">
                    <i class="fa-solid fa-database"></i>
                </div>
                <h2>数据库连接状态</h2>
            </div>

            <div class="monitor-value" id="database-status">--</div>

            <p class="monitor-description">
                显示系统当前是否能够正常连接并访问数据库。
            </p>
        </div>

        <div class="monitor-card">
            <div class="monitor-title">
                <div class="monitor-icon orange">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <h2>部署环境</h2>
            </div>

            <div class="monitor-value" id="deploy-environment">--</div>

            <p class="monitor-description">
                显示当前系统运行环境，例如 Development 或 Production。
            </p>
        </div>

        <div class="monitor-card">
            <div class="monitor-title">
                <div class="monitor-icon purple">
                    <i class="fa-solid fa-code-branch"></i>
                </div>
                <h2>系统版本</h2>
            </div>

            <div class="monitor-value" id="system-version">--</div>

            <p class="monitor-description">
                当前后台系统版本，用于后续功能迭代和版本管理。
            </p>
        </div>

    </div>

</div>

<script src="/static/js/common/current_user.js"></script>
<script src="/static/js/common/logout.js"></script>
<script src="/static/js/admin/system_monitor/runtime.js"></script>
<script src="/static/js/admin/system_monitor/monitor_data.js"></script>
<script src="/static/js/admin/system_monitor/init.js"></script>

</body>
</html>
