<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <title>UREAKING Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/admin/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/admin/language.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/admin/dashboard.css?v={{ static_version }}">

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main">

    <div class="top-bar">

        <div class="title-area">
            <h1 data-i18n="dashboard">控制面板</h1>
            <p id="current-group-text"></p>
        </div>

        <div class="admin-area">

            <button
                id="language-toggle"
                class="dashboard-language-toggle"
                type="button"
                onclick="toggleLanguage()"
            >
                ENGLISH
            </button>

            <img
                id="avatar-preview"
                class="avatar"
                src="/static/images/default_avatar.jpg"
                alt="avatar"
            >

            <label
                for="avatar-input"
                class="upload-avatar-button"
                data-i18n="uploadAvatar"
            >
                更换头像
            </label>

            <input
                type="file"
                id="avatar-input"
                accept="image/jpeg,image/png,image/webp"
                onchange="uploadAvatar()"
                hidden
            >

            <div class="admin-tag">
                <span class="status-dot"></span>
                <span data-i18n="admin">管理员</span>
            </div>

        </div>

    </div>

    <div class="stats">

        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="stat-title" data-i18n="totalUsers">总用户数</div>
            </div>
            <div class="stat-value" id="total-users">--</div>
        </div>

        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon blue">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div class="stat-title" data-i18n="totalGroups">总组数</div>
            </div>
            <div class="stat-value" id="total-groups">--</div>
        </div>

        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon green">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="stat-title" data-i18n="adminCount">管理员数量</div>
            </div>
            <div class="stat-value" id="admin-count">--</div>
        </div>

        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon purple">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <div class="stat-title" data-i18n="organizerCount">局头数量</div>
            </div>
            <div class="stat-value" id="organizer-count">--</div>
        </div>

        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon">
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="stat-title" data-i18n="userCount">普通用户数量</div>
            </div>
            <div class="stat-value" id="user-count">--</div>
        </div>

        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon orange">
                    <i class="fa-solid fa-ticket"></i>
                </div>
                <div class="stat-title" data-i18n="unusedInviteCodes">未使用邀请码</div>
            </div>
            <div class="stat-value" id="unused-invite-count">--</div>
        </div>

    </div>

    <h2 class="section-title" data-i18n="managementModules">管理模块</h2>

    <div class="modules">

        <div class="module-card" onclick="window.location.href='/system-monitor'">
            <div class="module-title">
                <div class="module-icon">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <h2 data-i18n="systemMonitor">系统监控</h2>
            </div>
            <i class="fa-solid fa-chevron-right module-arrow"></i>
            <p data-i18n="systemMonitorDesc">
                查看服务运行时长、数据库连接状态、部署环境与系统版本。
            </p>
        </div>

        <div class="module-card" onclick="window.location.href='/user-management'">
            <div class="module-title">
                <div class="module-icon green">
                    <i class="fa-regular fa-user"></i>
                </div>
                <h2 data-i18n="userManagement">用户管理</h2>
            </div>
            <i class="fa-solid fa-chevron-right module-arrow"></i>
            <p data-i18n="userManagementDesc">
                查看用户信息、维护身份权限、组别归属与账号状态。
            </p>
        </div>

        <div class="module-card" onclick="window.location.href='/invite-management'">
            <div class="module-title">
                <div class="module-icon orange">
                    <i class="fa-solid fa-ticket"></i>
                </div>
                <h2 data-i18n="inviteManagement">邀请码管理</h2>
            </div>
            <i class="fa-solid fa-chevron-right module-arrow"></i>
            <p data-i18n="inviteManagementDesc">
                生成邀请码并绑定身份与组别，控制系统注册来源。
            </p>
        </div>

        <div class="module-card" onclick="window.location.href='/system-logs'">
            <div class="module-title">
                <div class="module-icon purple">
                    <i class="fa-regular fa-file-lines"></i>
                </div>
                <h2 data-i18n="systemLogs">系统日志</h2>
            </div>
            <i class="fa-solid fa-chevron-right module-arrow"></i>
            <p data-i18n="systemLogsDesc">
                查看登录、注册、邀请码使用与权限变更等系统记录。
            </p>
        </div>

        <div class="module-card" onclick="window.location.href='/announcement-management'">
            <div class="module-title">
                <div class="module-icon yellow">
                    <i class="fa-solid fa-bullhorn"></i>
                </div>
                <h2 data-i18n="announcementManagement">公告管理</h2>
            </div>
            <i class="fa-solid fa-chevron-right module-arrow"></i>
            <p data-i18n="announcementManagementDesc">
                发布系统公告、活动通知与生态规则相关说明内容。
            </p>
        </div>

        <div class="module-card" onclick="window.location.href='/change-password'">
            <div class="module-title">
                <div class="module-icon red">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 data-i18n="changePassword">修改密码</h2>
            </div>
            <i class="fa-solid fa-chevron-right module-arrow"></i>
            <p data-i18n="changePasswordDesc">
                修改当前管理员账户密码并提升系统账号安全性。
            </p>
        </div>

    </div>

</div>

<script src="/static/js/i18n/admin.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/current_user.js?v={{ static_version }}"></script>
<script src="/static/js/common/logout.js?v={{ static_version }}"></script>
<script src="/static/js/admin/dashboard/stats.js?v={{ static_version }}"></script>
<script src="/static/js/admin/dashboard/avatar_validation.js?v={{ static_version }}"></script>
<script src="/static/js/admin/dashboard/avatar_upload.js?v={{ static_version }}"></script>
<script src="/static/js/admin/dashboard/init.js?v={{ static_version }}"></script>

</body>
</html>
