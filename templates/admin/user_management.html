<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <title>用户管理</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/admin/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/admin/user_management.css?v={{ static_version }}">

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main">

    <div class="top-bar">

        <div class="title-area">
            <h1 data-i18n="userManagement">用户管理</h1>
            <p id="current-group-text"></p>
        </div>

        <div class="admin-area">

            <img
                id="avatar-preview"
                class="avatar"
                src="/static/images/default_avatar.jpg"
                alt="头像"
            >

            <div class="admin-tag">
                <span class="status-dot"></span>
                <span data-i18n="admin">管理员</span>
            </div>

        </div>

    </div>

    <div class="toolbar">

        <div class="search-area">

            <input
                type="text"
                id="user-search"
                class="search-box"
                placeholder="输入用户名、昵称、身份或组名"
            >

            <button class="search-button" onclick="searchUsers()">
                搜索
            </button>

            <button class="clear-button" onclick="clearSearch()">
                清除
            </button>

        </div>

        <div id="search-message" class="search-message"></div>

    </div>

    <div class="table-card">

        <table>

            <thead>
                <tr>
                    <th>用户</th>
                    <th>昵称</th>
                    <th>身份</th>
                    <th>组别</th>
                    <th>注册时间</th>
                </tr>
            </thead>

            <tbody id="user-table-body"></tbody>

        </table>

    </div>

    <div class="detail-panel">

        <h2>用户详情</h2>

        <div class="detail-grid">

            <div class="detail-item">
                <div class="detail-label">用户名</div>
                <div class="detail-value" id="detail-username">--</div>
            </div>

            <div class="detail-item">
                <div class="detail-label">昵称</div>
                <div class="detail-value" id="detail-nickname">--</div>
            </div>

            <div class="detail-item">
                <div class="detail-label">身份</div>
                <div class="detail-value" id="detail-role">--</div>
            </div>

            <div class="detail-item">
                <div class="detail-label">组别</div>
                <div class="detail-value" id="detail-group">--</div>
            </div>

            <div class="detail-item">
                <div class="detail-label">注册时间</div>
                <div class="detail-value" id="detail-created-at">--</div>
            </div>

            <div class="detail-item">
                <div class="detail-label">账号状态</div>
                <div class="detail-value" id="detail-status">正常</div>
            </div>

        </div>

    </div>

    <div class="management-actions">

        <div class="action-panel">

            <div class="panel-title">
                <i class="fa-solid fa-pen-to-square"></i>
                <h2>修改用户信息</h2>
            </div>

            <p class="panel-description">
                支持修改当前组别下的用户身份。管理员账号信息不可在此页面修改，用户身份只能修改为 organizer 或 user。
            </p>

            <div class="form-grid">

                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="edit-nickname" placeholder="输入新的昵称">
                </div>

                <div class="form-group">
                    <label>身份</label>
                    <select id="edit-role">
                        <option value="">选择身份</option>
                        <option value="organizer">organizer</option>
                        <option value="user">user</option>
                    </select>
                </div>

            </div>

            <button class="panel-button">
                保存修改
            </button>

        </div>

        <div class="action-panel">

            <div class="panel-title">
                <i class="fa-solid fa-key"></i>
                <h2 data-i18n="resetPassword">重置密码</h2>
            </div>

            <p class="panel-description" data-i18n="resetPasswordDesc">
                点击确认后，系统会将所选用户的登录密码重置为默认密码 123456。
            </p>

            <button class="panel-button warning" data-i18n="confirmResetPassword">
                确认重置密码
            </button>

        </div>

        <div class="action-panel">

            <div class="panel-title">
                <i class="fa-solid fa-user-slash"></i>
                <h2>禁用 / 启用账号</h2>
            </div>

            <p class="panel-description">
                后续通过 is_active 字段控制账号状态。
            </p>

            <div class="status-preview">

                <span class="status-label">
                    当前状态
                </span>

                <span class="status-badge active" id="selected-user-status">
                    正常
                </span>

            </div>

            <button class="panel-button danger">
                禁用账号
            </button>

        </div>

    </div>

</div>

<script src="/static/js/i18n/admin.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/current_user.js?v={{ static_version }}"></script>
<script src="/static/js/common/logout.js?v={{ static_version }}"></script>
<script src="/static/js/admin/user_management/state.js?v={{ static_version }}"></script>
<script src="/static/js/admin/user_management/user_api.js?v={{ static_version }}"></script>
<script src="/static/js/admin/user_management/user_render.js?v={{ static_version }}"></script>
<script src="/static/js/admin/user_management/user_search.js?v={{ static_version }}"></script>
<script src="/static/js/admin/user_management/user_detail.js?v={{ static_version }}"></script>
<script src="/static/js/admin/user_management/init.js?v={{ static_version }}"></script>

</body>
</html>
