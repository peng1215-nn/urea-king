<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - UREAKING POKER</title>
    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/register.css?v={{ static_version }}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
<div class="register-card">

    <div class="title-area">
        <h1>UREAKING</h1>
        <p class="login-poker-sub">POKER</p>
    </div>

    <p style="color:#aaa;font-size:13px;margin-bottom:20px;text-align:center;">
        输入注册时使用的邮箱，我们将发送密码重置链接。
    </p>

    <div class="form-group">
        <label for="fp-email">邮箱</label>
        <input type="email" id="fp-email" placeholder="请输入邮箱地址">
    </div>

    <div id="message-box"></div>

    <button class="register-button" id="fp-btn" onclick="sendForgotPassword()">
        发送重置邮件
    </button>

    <div class="bottom-links">
        <a href="/login">返回登录</a>
    </div>

</div>
</div>

<script src="/static/css/../js/common/escape.js?v={{ static_version }}"></script>
<script>
async function sendForgotPassword() {
    const email = document.getElementById("fp-email").value.trim();
    const msgBox = document.getElementById("message-box");
    const btn = document.getElementById("fp-btn");

    if (!email) {
        msgBox.textContent = "请输入邮箱地址。";
        msgBox.style.color = "#e55";
        return;
    }

    btn.disabled = true;
    btn.textContent = "发送中…";

    try {
        const fd = new FormData();
        fd.append("email", email);
        const res = await fetch("/forgot-password", { method: "POST", body: fd });
        await res.json();

        // 无论成功失败都显示同一提示（防枚举）
        msgBox.textContent = "如果该邮箱已注册，重置链接已发送，请查收邮件。链接 15 分钟内有效。";
        msgBox.style.color = "#5c5";
        btn.style.display = "none";
    } catch (e) {
        msgBox.textContent = "请求失败，请稍后重试。";
        msgBox.style.color = "#e55";
        btn.disabled = false;
        btn.textContent = "发送重置邮件";
    }
}
</script>

</body>
</html>
