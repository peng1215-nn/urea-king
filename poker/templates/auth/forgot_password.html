<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">找回密码 - UREAKING POKER</title>
    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/register.css?v={{ static_version }}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
<div class="register-card">

    <div class="title-area">
        <h1>UREAKING</h1>
        <p class="login-poker-sub">POKER</p>
    </div>

    <p style="color:#aaa;font-size:13px;margin-bottom:20px;text-align:center;"
       data-i18n="tip">
        输入注册时使用的邮箱，我们将发送密码重置链接。
    </p>

    <div class="form-group">
        <label for="fp-email" data-i18n="email">邮箱</label>
        <input type="email" id="fp-email"
               placeholder="请输入邮箱地址"
               data-i18n-placeholder="emailPlaceholder">
    </div>

    <div id="message-box"></div>

    <button class="register-button" id="fp-btn" onclick="sendForgotPassword()"
            data-i18n="sendBtn">
        发送重置邮件
    </button>

    <div class="bottom-links">
        <a href="/login" data-i18n="backToLogin">返回登录</a>
    </div>

</div>
</div>

<script src="/static/js/i18n/forgot_password.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/escape.js?v={{ static_version }}"></script>
<script src="/static/js/auth/forgot_password/forgot_password.js?v={{ static_version }}"></script>

</body>
</html>
