<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">UREAKING-POKER</title>

    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/register.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/common/language_base.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/language.css?v={{ static_version }}">

</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">

    <div class="register-card">

        <div class="title-area">
            <h1>UREAKING</h1>
            <p class="login-poker-sub">POKER</p>
        </div>

        {% include "common/language_switcher.html" %}

        <form id="register-form" class="auth-form" novalidate>

        <div class="form-group">
            <label for="username" data-i18n="username">用户名</label>

            <input
                type="text"
                id="username"
                name="username"
                maxlength="50"
                autocomplete="username"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                aria-describedby="username-hint"
                placeholder="请输入用户名"
                data-i18n-placeholder="enterUsername"
            >
            <p id="username-hint" class="field-hint" data-i18n="usernameRule">用户名以英文字母开头，5–50 位，只能包含英文字母、数字和下划线（区分大小写）。</p>
        </div>

        <div class="form-group">
            <label for="nickname" data-i18n="nickname">昵称</label>

            <input
                type="text"
                id="nickname"
                name="nickname"
                autocomplete="nickname"
                placeholder="请输入昵称"
                data-i18n-placeholder="enterNickname"
            >
        </div>

        <div class="form-group">
            <label for="password" data-i18n="password">密码</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                aria-describedby="password-hint"
                placeholder="请输入密码"
                data-i18n-placeholder="enterPassword"
            >
            <p id="password-hint" class="field-hint" data-i18n="passwordHint">密码至少 8 位（最多 72 个英文字符或 24 个汉字），不能是重复、连续的字符或常见密码。</p>
        </div>

        <div class="form-group">
            <label
                for="confirm-password"
                data-i18n="confirmPassword"
            >
                确认密码
            </label>

            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                autocomplete="new-password"
                placeholder="请再次输入密码"
                data-i18n-placeholder="reEnterPassword"
            >
        </div>

        <div class="form-group">
            <label for="email" data-i18n="email">邮箱</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                autocapitalize="off"
                spellcheck="false"
                placeholder="请输入邮箱地址"
                data-i18n-placeholder="enterEmail"
            >
        </div>

        <div id="message-box" role="alert" aria-live="polite"></div>

        <button
            type="submit"
            id="register-button"
            class="register-button"
            data-i18n="registerAccount"
        >
            注册账号
        </button>

        <p class="privacy-consent">
            <span data-i18n="privacyConsentPrefix">注册即表示你已阅读</span><a href="/privacy" target="_blank" rel="noopener" data-i18n="privacyConsentLink">《隐私说明》</a><span data-i18n="privacyConsentSuffix">。</span>
        </p>

        </form>

        <div class="bottom-links">
            <a href="/login" data-i18n="backToLogin">返回登录</a>
            <a href="#" id="resend-trigger" data-i18n="resendVerifyTitle">重发验证邮件</a>
            <a href="#" id="change-email-trigger" data-i18n="changeEmailTitle">修改注册邮箱</a>
        </div>

    </div>

</div>

<script src="/static/js/common/actions.js?v={{ static_version }}"></script>
<script src="/static/js/common/escape.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/register.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/auth/common/auth_form.js?v={{ static_version }}"></script>
<script src="/static/js/auth/register/message.js?v={{ static_version }}"></script>
<script src="/static/js/auth/register/form.js?v={{ static_version }}"></script>
<script src="/static/js/auth/register/redirect.js?v={{ static_version }}"></script>
<script src="/static/js/auth/register/register.js?v={{ static_version }}"></script>
<script src="/static/js/auth/register/init.js?v={{ static_version }}"></script>
<script src="/static/js/auth/register/resend_verify.js?v={{ static_version }}"></script>
<script src="/static/js/auth/register/change_email.js?v={{ static_version }}"></script>

</body>
</html>
