<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - UREAKING POKER</title>
    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/register.css?v={{ static_version }}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
<div class="register-card">

    <div class="title-area">
        <h1>UREAKING</h1>
        <p class="login-poker-sub">POKER</p>
    </div>

    <div id="message-box"></div>

    <div id="reset-form">
        <div class="form-group">
            <label for="new-password">新密码</label>
            <input type="password" id="new-password" placeholder="请输入新密码（至少 8 位）">
        </div>

        <div class="form-group">
            <label for="confirm-password">确认新密码</label>
            <input type="password" id="confirm-password" placeholder="请再次输入新密码">
        </div>

        <button class="register-button" id="rp-btn" data-token="{{ token }}">
            重置密码
        </button>
    </div>

    <div class="bottom-links">
        <a href="/login">返回登录</a>
    </div>

</div>
</div>

<script src="/static/js/common/actions.js?v={{ static_version }}"></script>
<script src="/static/js/auth/reset_password/reset_password.js?v={{ static_version }}"></script>

</body>
</html>
