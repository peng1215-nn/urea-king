<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - UREAKING POKER</title>
    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/register.css?v={{ static_version }}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
<div class="register-card">

    <div class="title-area">
        <h1>UREAKING</h1>
        <p class="login-poker-sub">POKER</p>
    </div>

    <div id="message-box"></div>

    <div id="reset-form">
        <div class="form-group">
            <label for="new-password">新密码</label>
            <input type="password" id="new-password" placeholder="请输入新密码（至少 8 位）">
        </div>

        <div class="form-group">
            <label for="confirm-password">确认新密码</label>
            <input type="password" id="confirm-password" placeholder="请再次输入新密码">
        </div>

        <button class="register-button" id="rp-btn" onclick="resetPassword()">
            重置密码
        </button>
    </div>

    <div class="bottom-links">
        <a href="/login">返回登录</a>
    </div>

</div>
</div>

<script>
const RESET_TOKEN = {{ token | tojson }};

const ERROR_MESSAGES = {
    resetPasswordMismatch: "两次输入的密码不一致。",
    resetPasswordTooShort: "密码长度至少为 8 位。",
    resetPasswordTooLong: "密码不能超过 128 位。",
    resetTokenInvalid: "重置链接无效，请重新申请。",
    resetTokenUsed: "该重置链接已使用，请重新申请。",
    resetTokenExpired: "重置链接已过期，请重新申请。",
    resetFailed: "重置失败，请稍后重试。",
};

async function resetPassword() {
    const msgBox = document.getElementById("message-box");
    const btn = document.getElementById("rp-btn");
    const newPwd = document.getElementById("new-password").value;
    const confirmPwd = document.getElementById("confirm-password").value;

    if (!RESET_TOKEN) {
        msgBox.textContent = "无效的重置链接，请从邮件中点击链接进入。";
        msgBox.style.color = "#e55";
        return;
    }

    btn.disabled = true;
    btn.textContent = "重置中…";

    try {
        const fd = new FormData();
        fd.append("token", RESET_TOKEN);
        fd.append("new_password", newPwd);
        fd.append("confirm_password", confirmPwd);

        const res = await fetch("/reset-password", { method: "POST", body: fd });
        const data = await res.json();

        if (data.success) {
            msgBox.textContent = "密码重置成功！请使用新密码登录。";
            msgBox.style.color = "#5c5";
            document.getElementById("reset-form").style.display = "none";
        } else {
            msgBox.textContent = ERROR_MESSAGES[data.error_code] || "重置失败，请稍后重试。";
            msgBox.style.color = "#e55";
            btn.disabled = false;
            btn.textContent = "重置密码";
        }
    } catch (e) {
        msgBox.textContent = "请求失败，请稍后重试。";
        msgBox.style.color = "#e55";
        btn.disabled = false;
        btn.textContent = "重置密码";
    }
}
</script>

</body>
</html>
