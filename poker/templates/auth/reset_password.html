<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="resetPageTitle">重置密码 - UREAKING POKER</title>
    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/register.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/common/language_base.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/language.css?v={{ static_version }}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
<div class="register-card">

    <div class="title-area">
        <h1>UREAKING</h1>
        <p class="login-poker-sub">POKER</p>
    </div>

    {% if error_code %}
    <div id="message-box" role="alert" aria-live="polite" style="color:#e55;" data-i18n="{{ error_code }}">重置链接无效，请重新申请。</div>

    <a class="register-button register-link-button" href="/forgot-password" data-i18n="requestNewLink">重新申请重置邮件</a>
    {% else %}
    <div id="message-box" role="alert" aria-live="polite"></div>

    <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
            <label for="new-password" data-i18n="newPassword">新密码</label>
            <input type="password" id="new-password" name="new-password"
                   autocomplete="new-password"
                   aria-describedby="new-password-hint"
                   placeholder="请输入新密码（至少 8 位）"
                   data-i18n-placeholder="newPasswordPlaceholder">
            <p id="new-password-hint" class="field-hint" data-i18n="passwordHint">密码至少 8 位（最多 72 个英文字符或 24 个汉字），不能是重复、连续的字符或常见密码。</p>
        </div>

        <div class="form-group">
            <label for="confirm-password" data-i18n="confirmPassword">确认新密码</label>
            <input type="password" id="confirm-password" name="confirm-password"
                   autocomplete="new-password"
                   placeholder="请再次输入新密码"
                   data-i18n-placeholder="confirmPasswordPlaceholder">
        </div>

        <button type="submit" class="register-button" id="rp-btn"
                data-token="{{ token }}"
                data-i18n="resetPasswordBtn">
            重置密码
        </button>
    </form>
    {% endif %}

    <div class="bottom-links">
        <a href="/login" data-i18n="backToLogin">返回登录</a>
        {% if not error_code %}
        <a href="/forgot-password" id="request-new-link" data-i18n="requestNewLink" hidden>重新申请重置邮件</a>
        {% endif %}
    </div>

</div>
</div>

{% include "common/language_switcher.html" %}

<script src="/static/js/i18n/forgot_password.js?v={{ static_version }}"></script>
<script src="/static/js/common/actions.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/auth/common/auth_form.js?v={{ static_version }}"></script>
<script src="/static/js/auth/reset_password/reset_password.js?v={{ static_version }}"></script>

</body>
</html>
