<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="groupJoinPageTitle">UREAKING-POKER</title>

    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/group_join.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/common/language_base.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/language.css?v={{ static_version }}">

</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">

    <div class="group-join-card">

        <div class="title-area">
            <h1>UREAKING</h1>
            <p class="login-poker-sub">POKER</p>
        </div>

        <div class="group-join-heading">
            <h2 data-i18n="groupJoinTitle">加入组</h2>
            <p data-i18n="groupJoinDesc">已有账号可通过邀请码加入新的组。</p>
        </div>

        <form id="group-join-form" class="auth-form" novalidate>

        {% if not is_logged_in %}
        <div class="form-group">
            <label for="username" data-i18n="username">用户名</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                placeholder="请输入用户名"
                data-i18n-placeholder="enterUsername"
            >
        </div>

        <div class="form-group">
            <label for="password" data-i18n="password">密码</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="请输入密码"
                data-i18n-placeholder="enterPassword"
            >
        </div>
        {% endif %}

        <div class="form-group">
            <label for="invite-code" data-i18n="inviteCode">邀请码</label>

            <input
                type="text"
                id="invite-code"
                name="invite-code"
                autocomplete="off"
                autocapitalize="characters"
                autocorrect="off"
                spellcheck="false"
                placeholder="请输入邀请码"
                data-i18n-placeholder="enterInviteCode"
            >
        </div>

        <div id="message-box" role="alert" aria-live="polite"></div>

        <button
            type="submit"
            id="group-join-button"
            class="group-join-button"
            data-i18n="groupJoinSubmit"
        >
            加入组
        </button>

        </form>

        <div class="bottom-links">
            {% if is_logged_in %}
            <a href="/group-select" data-i18n="backToGroupSelect">
                返回选组
            </a>
            {% else %}
            <a href="/login" data-i18n="backToLogin">
                返回登录
            </a>
            {% endif %}
        </div>

    </div>

</div>

{% include "common/language_switcher.html" %}

<script src="/static/js/common/actions.js?v={{ static_version }}"></script>
<script src="/static/js/common/escape.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/login.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/auth/common/auth_form.js?v={{ static_version }}"></script>
<script src="/static/js/auth/group_join/group_join.js?v={{ static_version }}"></script>

</body>
</html>
