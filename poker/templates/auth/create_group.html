<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建组 - UREAKING POKER</title>
    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/register.css?v={{ static_version }}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
<div class="register-card">

    <div class="title-area">
        <h1>UREAKING</h1>
        <p class="login-poker-sub">POKER</p>
    </div>

    <p style="color:#f0a020;font-size:12px;text-align:center;margin-bottom:8px;letter-spacing:0.5px;">
        ⚠️ 测试功能，日后会删档
    </p>

    <p style="color:#aaa;font-size:13px;margin-bottom:20px;text-align:center;">
        创建自己的组，成为局头。每个账号只能创建一个组。<br>
        成员加入需使用邀请码。
    </p>

    <div class="form-group">
        <label for="group-name">组名</label>
        <input type="text" id="group-name" placeholder="请输入组名（最多 50 字符）" maxlength="50">
    </div>

    <div id="message-box"></div>

    <button class="register-button" id="cg-btn" onclick="createGroup()">
        创建组
    </button>

    <div class="bottom-links" id="bottom-links">
        <a href="/group-select">返回选组</a>
        <a href="/group-join">加入已有组</a>
    </div>

</div>
</div>

<script>
const ERROR_MESSAGES = {
    loginRequired: "请先登录。",
    createGroupNameRequired: "请输入组名。",
    createGroupNameTooLong: "组名不能超过 50 个字符。",
    createGroupNameInvalid: "组名包含非法字符。",
    createGroupNotVerified: "请先验证邮箱。",
    createGroupAlreadyOwner: "您已创建过一个组，每个账号只能创建一个组。",
    createGroupFailed: "创建失败，请稍后重试。",
};

async function createGroup() {
    const msgBox = document.getElementById("message-box");
    const btn = document.getElementById("cg-btn");
    const groupName = document.getElementById("group-name").value.trim();

    if (!groupName) {
        msgBox.textContent = "请输入组名。";
        msgBox.style.color = "#e55";
        return;
    }

    btn.disabled = true;
    btn.textContent = "创建中…";

    try {
        const fd = new FormData();
        fd.append("group_name", groupName);

        const res = await fetch("/create-group", { method: "POST", body: fd });
        const data = await res.json();

        if (data.success) {
            msgBox.textContent = `组「${data.group_name}」创建成功！组代码：${data.group_code}`;
            msgBox.style.color = "#5c5";
            btn.style.display = "none";

            // 3秒后跳转到选组页
            setTimeout(() => { window.location.href = "/group-select"; }, 3000);
        } else {
            if (data.error_code === "loginRequired") {
                window.location.href = "/login";
                return;
            }
            msgBox.textContent = ERROR_MESSAGES[data.error_code] || "创建失败，请稍后重试。";
            msgBox.style.color = "#e55";
            btn.disabled = false;
            btn.textContent = "创建组";
        }
    } catch (e) {
        msgBox.textContent = "请求失败，请稍后重试。";
        msgBox.style.color = "#e55";
        btn.disabled = false;
        btn.textContent = "创建组";
    }
}
</script>

</body>
</html>
