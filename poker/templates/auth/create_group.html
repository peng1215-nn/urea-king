<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">创建组 - UREAKING POKER</title>
    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/register.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/common/language_base.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/language.css?v={{ static_version }}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">
<div class="register-card">

    <div class="title-area">
        <h1>UREAKING</h1>
        <p class="login-poker-sub">POKER</p>
    </div>

    <p style="color:#aaa;font-size:13px;margin-bottom:20px;text-align:center;">
        <span data-i18n="createGroupDesc">创建自己的组，成为局头。每个账号只能创建一个组。</span><br>
        <span data-i18n="createGroupDesc2">成员加入需使用邀请码。</span>
    </p>

    <form id="cg-form" class="auth-form" novalidate>
    <div class="form-group">
        <label for="group-name" data-i18n="groupNameLabel">组名</label>
        <input type="text" id="group-name" name="group-name"
               autocomplete="off"
               placeholder="请输入组名（最多 50 字符）"
               data-i18n-placeholder="groupNamePlaceholder"
               maxlength="50">
    </div>

    <div id="message-box" role="alert" aria-live="polite"></div>

    <button type="submit" class="register-button" id="cg-btn" data-i18n="createGroupBtn">
        创建组
    </button>
    </form>

    <a class="register-button register-link-button" id="cg-continue" href="/group-select"
       data-i18n="continueBtn" hidden>进入</a>

    <div class="bottom-links" id="bottom-links">
        <a href="/group-select" data-i18n="backToGroupSelect">返回选组</a>
    </div>

</div>
</div>

{% include "common/language_switcher.html" %}

<script src="/static/js/i18n/create_group.js?v={{ static_version }}"></script>
<script src="/static/js/common/actions.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/auth/common/auth_form.js?v={{ static_version }}"></script>
<script src="/static/js/auth/create_group/create_group.js?v={{ static_version }}"></script>

</body>
</html>
