<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">UREAKING-POKER</title>

    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/common/language_base.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/language.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/login.css?v={{ static_version }}">

</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">

    <div class="login-card">

        <div class="title-area">
            <h1>UREAKING</h1>
            <p class="login-poker-sub">POKER</p>
        </div>

        {% include "common/language_switcher.html" %}

        <div id="message-box" class="message-box" role="alert" aria-live="polite"></div>

        <form id="login-form" class="auth-form" novalidate>

        <div class="form-group">
            <label for="username" data-i18n="username">用户名</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                placeholder="请输入用户名"
                data-i18n-placeholder="enterUsername"
            >
        </div>

        <div class="form-group">
            <label for="password" data-i18n="password">密码</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="请输入密码"
                data-i18n-placeholder="enterPassword"
            >
        </div>

        <button type="submit" id="login-button" class="login-button" data-i18n="login">
            登录
        </button>

        </form>

        <div class="text-links">
            <a href="/register" data-i18n="registerAccount">注册账号</a>
            <a href="/forgot-password" data-i18n="forgotPassword">忘记密码</a>
            <a href="/delete-account" data-i18n="accountDeleteLink">注销账号</a>
        </div>

        <p class="platform-hint">
            <span data-i18n="platformAccountHint">已在平台其他模块注册？</span><span data-i18n="platformAccountSuffix">无需重新注册，直接登录。</span>
        </p>

    </div>

</div>

<script src="/static/js/common/actions.js?v={{ static_version }}"></script>
<script src="/static/js/common/escape.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/login.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/auth/common/auth_form.js?v={{ static_version }}"></script>
<script src="/static/js/auth/login/message.js?v={{ static_version }}"></script>
<script src="/static/js/auth/login/form.js?v={{ static_version }}"></script>
<script src="/static/js/auth/login/login.js?v={{ static_version }}"></script>
<script src="/static/js/auth/login/forgot_password.js?v={{ static_version }}"></script>
<script src="/static/js/auth/login/init.js?v={{ static_version }}"></script>

<a class="login-back-link" href="{{ root_url() }}" aria-label="返回首页" data-i18n-aria-label="backHome">←</a>

</body>
</html>
