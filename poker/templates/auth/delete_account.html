<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">UREAKING-POKER</title>

    <link rel="stylesheet" href="/static/css/auth/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/group_join.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/auth/delete_account.css?v={{ static_version }}">

</head>

<body>

<div class="sidebar">
    <div class="sidebar-title">Ureaking</div>
</div>

<div class="page">

    <div class="group-join-card delete-account-card">

        <a class="delete-account-back" href="/login">&larr; <span data-i18n="backToLogin">返回登录</span></a>

        <div class="title-area">
            <h1>UREAKING</h1>
            <p class="login-poker-sub">POKER</p>
        </div>

        <div class="delete-account-notice">
            <strong data-i18n="accountDeleteTitle">注销账号</strong>
            <ul>
                <li data-i18n="accountDeleteRuleUser">普通用户：需要先在“修改资料”页面退出所有组。</li>
                <li data-i18n="accountDeleteRuleOrganizer">局头：你的组里不能还有其他成员；注销时该组和组内所有记录会一起删除。</li>
                <li data-i18n="accountDeleteRuleKeep">你在其他组参与过的牌局记录会保留，显示为“已注销用户”。注销后无法恢复。</li>
            </ul>
        </div>

        <div class="form-group">
            <label for="username" data-i18n="username">用户名</label>
            <input type="text" id="username" autocomplete="username"
                   placeholder="请输入用户名" data-i18n-placeholder="enterUsername">
        </div>

        <div class="form-group">
            <label for="password" data-i18n="password">密码</label>
            <input type="password" id="password" autocomplete="current-password"
                   placeholder="请输入密码" data-i18n-placeholder="enterPassword">
        </div>

        <div class="form-group">
            <label for="confirm-text" data-i18n="accountDeleteConfirmLabel">请输入“注销”确认</label>
            <input type="text" id="confirm-text" autocomplete="off"
                   placeholder="注销" data-i18n-placeholder="accountDeleteConfirmPlaceholder">
        </div>

        <div id="message-box" role="alert" aria-live="polite"></div>

        <button id="delete-account-button" class="group-join-button delete-account-button"
                data-on-click="deleteAccount" data-i18n="accountDeleteSubmit">
            永久注销账号
        </button>

        <div class="bottom-links">
            <a href="/login" data-i18n="backToLogin">返回登录</a>
        </div>

    </div>

</div>

<script src="/static/js/common/actions.js?v={{ static_version }}"></script>
<script src="/static/js/common/escape.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/login.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/auth/delete_account/delete_account.js?v={{ static_version }}"></script>

</body>
</html>
