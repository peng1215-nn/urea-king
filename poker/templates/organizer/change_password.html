
<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleChangePassword">UREAKING-POKER</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/common/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/organizer/change_password.css?v={{ static_version }}">

</head>

<body>

{% include "organizer/sidebar.html" %}

<div class="main">

    <div class="top-bar">

        <div class="title-area">
            <h1 data-i18n="changePassword">修改密码</h1>
            <p id="current-group-text"></p>
        </div>

        <div class="topbar-actions">

            <img
                id="avatar-preview"
                class="avatar"
                src="/static/images/default_avatar.jpg"
                alt="头像"
            >

            <div class="role-tag">
                <span class="status-dot"></span>
                <span data-i18n="organizer">局头</span>
            </div>

        </div>

    </div>

    <div class="profile-grid">

        <!-- 修改组名 -->
        <div class="profile-card">

            <div class="profile-card-header">
                <i class="fa-solid fa-users-gear"></i>
                <h2 data-i18n="updateGroupName">修改组名</h2>
            </div>

            <p data-i18n="updateGroupNameDesc">修改当前所在组的显示名称。</p>

            <div class="form-group">
                <label data-i18n="currentGroupName">当前组名</label>
                <input type="text" id="current-group-name" class="form-input" readonly>
            </div>

            <div class="form-group">
                <label for="new-group-name" data-i18n="newGroupName">新组名</label>
                <input type="text" id="new-group-name" class="form-input" maxlength="50"
                    data-i18n-placeholder="newGroupNamePlaceholder" placeholder="请输入新组名">
            </div>

            <div id="group-name-message" class="operation-message"></div>

            <button class="btn-save" data-i18n="saveGroupName" onclick="saveGroupName()">保存组名</button>

        </div>

        <!-- 修改昵称 -->
        <div class="profile-card">

            <div class="profile-card-header">
                <i class="fa-solid fa-user-pen"></i>
                <h2 data-i18n="updateNickname">修改昵称</h2>
            </div>

            <p data-i18n="updateNicknameDesc">
                修改当前账户显示昵称。
            </p>

            <div class="form-group">
                <label data-i18n="currentNickname">当前昵称</label>
                <input
                    type="text"
                    id="current-nickname"
                    class="form-input"
                    readonly
                >
            </div>

            <div class="form-group">
                <label for="new-nickname" data-i18n="newNickname">新昵称</label>
                <input
                    type="text"
                    id="new-nickname"
                    class="form-input"
                    maxlength="50"
                    data-i18n-placeholder="newNicknamePlaceholder"
                    placeholder="请输入新昵称"
                >
            </div>

            <div id="nickname-message" class="operation-message"></div>

            <button
                class="btn-save"
                data-i18n="saveNickname"
                onclick="saveNickname()"
            >
                保存昵称
            </button>

        </div>

        <!-- 修改密码 -->
        <div class="profile-card">

            <div class="profile-card-header">
                <i class="fa-solid fa-lock"></i>
                <h2 data-i18n="changePassword">修改密码</h2>
            </div>

            <p data-i18n="changePasswordFormDesc">
                修改密码需要输入当前密码。修改成功后将自动退出登录。
            </p>

            <div class="form-group">
                <label for="current-password" data-i18n="currentPassword">当前密码</label>
                <input
                    type="password"
                    id="current-password"
                    class="form-input"
                    data-i18n-placeholder="currentPasswordPlaceholder"
                    placeholder="请输入当前密码"
                >
            </div>

            <div class="form-group">
                <label for="new-password" data-i18n="newPassword">新密码</label>
                <input
                    type="password"
                    id="new-password"
                    class="form-input"
                    data-i18n-placeholder="newPasswordPlaceholder"
                    placeholder="请输入新密码"
                >
            </div>

            <div class="form-group">
                <label for="confirm-password" data-i18n="confirmNewPassword">确认新密码</label>
                <input
                    type="password"
                    id="confirm-password"
                    class="form-input"
                    data-i18n-placeholder="confirmNewPasswordPlaceholder"
                    placeholder="请再次输入新密码"
                >
            </div>

            <div id="password-message" class="operation-message"></div>

            <button
                class="btn-save btn-danger"
                data-i18n="changePassword"
                onclick="savePassword()"
            >
                修改密码
            </button>

        </div>

        <!-- 注销账号 -->
        <div class="profile-card danger-zone">
            <div class="profile-card-header">
                <i class="fa-solid fa-user-xmark"></i>
                <h2 data-i18n="deleteAccount">注销账号</h2>
            </div>
            <p data-i18n="deleteAccountDesc">注销后无法恢复。你的账号、昵称、头像和所在组的成员身份会被删除；你参与过的牌局记录会保留，以免影响其他人的账目。注销后你的用户名可以被别人重新注册。</p>

            <button class="btn-save btn-danger" type="button" onclick="openDeleteAccountModal()" data-i18n="deleteAccount">注销账号</button>
        </div>

    </div>

</div>

<div id="join-group-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">
        <h3 data-i18n="joinOtherGroup">加入其他组</h3>
        <p data-i18n="joinGroupLogoutConfirm">此操作会退出当前登录，是否确认？</p>
        <div class="custom-modal-actions">
            <button class="modal-confirm-button" data-i18n="confirm" onclick="confirmJoinGroup()">确认</button>
            <button class="modal-cancel-button" data-i18n="cancel" onclick="closeJoinGroupModal()">取消</button>
        </div>
    </div>
</div>

<div id="delete-account-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">
        <h3 data-i18n="deleteAccountConfirmTitle">确认注销账号</h3>
        <p data-i18n="deleteAccountConfirmDesc">此操作无法撤销。请输入当前密码，并在下方输入“注销”两个字以确认。</p>

        <div class="form-group">
            <label for="delete-account-password" data-i18n="currentPassword">当前密码</label>
            <input type="password" id="delete-account-password" class="form-input" autocomplete="current-password">
        </div>

        <div class="form-group">
            <label for="delete-account-confirm" data-i18n="deleteAccountTypeConfirm">输入“注销”确认</label>
            <input type="text" id="delete-account-confirm" class="form-input" autocomplete="off">
        </div>

        <div id="delete-account-message" class="operation-message"></div>

        <div class="custom-modal-actions">
            <button class="modal-confirm-button danger" id="delete-account-submit" type="button" onclick="confirmDeleteAccount()" data-i18n="deleteAccountConfirmButton">确认注销</button>
            <button class="modal-cancel-button" type="button" onclick="closeDeleteAccountModal()" data-i18n="cancel">取消</button>
        </div>
    </div>
</div>

<script src="/static/js/common/escape.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/dashboard/group_join.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/organizer.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/current_user.js?v={{ static_version }}"></script>
<script src="/static/js/common/logout.js?v={{ static_version }}"></script>
<script src="/static/js/common/sidebar.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/change_password/change_password_api.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/change_password/change_password_actions.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/change_password/group_name_api.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/change_password/group_name_actions.js?v={{ static_version }}"></script>
<script src="/static/js/common/account_delete.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/change_password/change_password_init.js?v={{ static_version }}"></script>

</body>
</html>
