<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <title data-i18n="inviteManagement">邀请码管理</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/common/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/organizer/invite_management.css?v={{ static_version }}">

</head>

<body>

{% include "organizer/sidebar.html" %}

<div class="main">

    <div class="top-bar">
        <div class="title-area">
            <h1 data-i18n="inviteManagement">邀请码管理</h1>
            <p class="page-subtitle" data-i18n="inviteManagementDesc">生成本组用户邀请码，查看使用状态，并撤销未使用的邀请码。</p>
        </div>
        <div class="topbar-actions">
            <img id="avatar-preview" class="avatar" src="/static/images/default_avatar.jpg" alt="头像">
            <div class="role-tag">
                <span class="status-dot"></span>
                <span data-i18n="organizer">局头</span>
            </div>
        </div>
    </div>

    <div class="invite-toolbar">
        <input
            type="text"
            id="invite-code-input"
            class="invite-code-input"
            maxlength="50"
            data-i18n-placeholder="inviteCodePlaceholder"
            placeholder="请输入邀请码"
        >
        <button class="btn-create-invite" onclick="createInviteCode()">
            <i class="fa-solid fa-plus"></i>
            <span data-i18n="createInviteCode">生成邀请码</span>
        </button>
        <div id="invite-message" class="operation-message"></div>
    </div>

    <div id="invite-list" class="invite-list">
        <div class="invite-loading" data-i18n="loading">加载中...</div>
    </div>

</div>

<div id="join-group-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">
        <h3 data-i18n="joinOtherGroup">加入其他组</h3>
        <p data-i18n="joinGroupLogoutConfirm">此操作会退出当前登录，是否确认？</p>
        <div class="custom-modal-actions">
            <button class="modal-confirm-button" data-i18n="confirm" onclick="confirmJoinGroup()">确认</button>
            <button class="modal-cancel-button" data-i18n="cancel" onclick="closeJoinGroupModal()">取消</button>
        </div>
    </div>
</div>

<script src="/static/js/organizer/dashboard/group_join.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/organizer.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/current_user.js?v={{ static_version }}"></script>
<script src="/static/js/common/logout.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/invite_management/invite_api.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/invite_management/invite_actions.js?v={{ static_version }}"></script>
<script src="/static/js/organizer/invite_management/invite_init.js?v={{ static_version }}"></script>

</body>
</html>
