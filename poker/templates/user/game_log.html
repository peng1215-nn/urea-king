<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleGameLogs">UREAKING-POKER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/common/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/user/game_log.css?v={{ static_version }}">
</head>
<body>

{% include "user/sidebar.html" %}

<div class="main">

    <div class="top-bar">
        <div class="title-area">
            <h1 data-i18n="gameLogs">牌局日志</h1>
            <p id="current-group-text"></p>
        </div>
        <div class="topbar-actions">
            <img id="avatar-preview" class="avatar" src="/static/images/default_avatar.jpg" alt="avatar">
            <div class="role-tag">
                <span class="status-dot"></span>
                <span data-i18n="roleUser">用户</span>
            </div>
        </div>
    </div>

    <div class="log-view-tabs">
        <button id="btn-logs" class="log-view-tab active" onclick="switchView('logs')" data-i18n="gameLogList">牌局记录</button>
        <button id="btn-stats" class="log-view-tab" onclick="switchView('stats')" data-i18n="statsPanel">统计面板</button>
        <button id="btn-member-stats" class="log-view-tab" onclick="switchView('member-stats')" data-i18n="memberStats">成员统计</button>
    </div>

    <div id="view-logs">
        <div class="log-search-bar">
            <input id="log-search-input" class="log-search-input" type="text" data-i18n-placeholder="searchGameLogs" placeholder="搜索牌局名称或备注…" oninput="onSearch()">
            <i class="fa-solid fa-magnifying-glass log-search-icon"></i>
        </div>
        <div id="game-log-list" class="game-log-list">
            <div class="log-loading" data-i18n="loading">加载中...</div>
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <div id="view-stats" style="display:none;">
        <div id="stats-panel" class="stats-panel">
            <div class="log-loading" data-i18n="loading">加载中...</div>
        </div>
    </div>

    <div id="view-member-stats" style="display:none;">
        <div id="member-stats-panel" class="member-stats-panel">
            <div class="log-loading" data-i18n="loading">加载中...</div>
        </div>
    </div>

</div>

<div id="member-trend-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content modal-wide trend-modal-content">
        <h3 id="trend-modal-title">走势图</h3>
        <div class="trend-chart-wrap">
            <canvas id="trend-chart"></canvas>
        </div>
        <div class="trend-summary" id="trend-summary"></div>
        <div class="custom-modal-actions">
            <button class="modal-cancel-button" onclick="closeMemberTrendModal()" data-i18n="close">关闭</button>
        </div>
    </div>
</div>

<div id="join-group-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">
        <h3 data-i18n="joinOtherGroup">加入其他组</h3>
        <p data-i18n="joinGroupLogoutConfirm">此操作会退出当前登录，是否确认？</p>
        <div class="custom-modal-actions">
            <button class="modal-confirm-button" onclick="confirmJoinGroup()" data-i18n="confirm">确认</button>
            <button class="modal-cancel-button" onclick="closeJoinGroupModal()" data-i18n="cancel">取消</button>
        </div>
    </div>
</div>

<script src="/static/js/user/dashboard/group_join.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/user.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/current_user.js?v={{ static_version }}"></script>
<script src="/static/js/common/logout.js?v={{ static_version }}"></script>
<script src="/static/js/common/sidebar.js?v={{ static_version }}"></script>
<script src="/static/js/common/overflow_tooltip.js?v={{ static_version }}"></script>
<script src="/static/js/common/game_pdf.js?v={{ static_version }}"></script>
<script src="/static/js/user/game_log/game_log_api.js?v={{ static_version }}"></script>
<script src="/static/js/user/game_log/game_log_render.js?v={{ static_version }}"></script>
<script src="/static/js/user/game_log/game_log_init.js?v={{ static_version }}"></script>

</body>
</html>
