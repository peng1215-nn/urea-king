<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleCurrentGame">UREAKING-POKER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/common/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/user/game.css?v={{ static_version }}">
</head>
<body>

{% include "user/sidebar.html" %}

<div class="main">

    <div class="top-bar">
        <div class="title-area">
            <h1 data-i18n="currentGame">当前牌局</h1>
            <p id="current-group-text"></p>
        </div>
        <div class="topbar-actions">
            <button type="button" class="game-settings-btn" data-on-click="openGameSettings" data-i18n-title="gameSettings" title="牌局设置">
                <i class="fa-solid fa-sliders"></i>
                <span class="game-settings-label" data-i18n="chipAuthTitle">筹码操作授权</span>
            </button>
            <img id="avatar-preview" class="avatar" src="/static/images/default_avatar.jpg" alt="avatar">
            <div class="role-tag">
                <span class="status-dot"></span>
                <span data-i18n="roleUser">用户</span>
            </div>
        </div>
    </div>

    <div id="game-conn-status" class="game-conn-status" role="status" hidden></div>

    <div id="game-list" class="game-list">
        <div class="game-loading" data-i18n="loading">加载中...</div>
    </div>

</div>

<!-- 买入申请 Modal -->
<div id="buyin-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">
        <h3 data-i18n="submitBuyinRequest">提交买入申请</h3>
        <p class="modal-desc" data-i18n="buyinRequestDesc">填写买入数额，由局头审批后生效。</p>
        <div class="form-group">
            <label data-i18n="buyinRequestAmount">申请数额</label>
            <input type="number" id="buyin-amount" class="modal-input" min="1" data-i18n-placeholder="buyinAmountPlaceholder" placeholder="请输入数额">
        </div>
        <div id="buyin-message" class="operation-message"></div>
        <div class="custom-modal-actions">
            <button id="buyin-confirm-button" class="modal-confirm-button" data-on-click="confirmBuyin" data-i18n="confirm">确认</button>
            <button class="modal-cancel-button" data-on-click="closeBuyinModal" data-i18n="cancel">取消</button>
        </div>
    </div>
</div>

<!-- 撤回买入申请 Modal -->
<div id="withdraw-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">
        <h3 data-i18n="withdrawRequestTitle">撤回买入申请</h3>
        <p id="withdraw-desc" class="modal-desc"></p>
        <div id="withdraw-message" class="operation-message withdraw-message"></div>
        <div class="custom-modal-actions">
            <button type="button" id="withdraw-confirm-button" class="modal-confirm-button modal-danger-button" data-on-click="confirmWithdrawRequest" data-i18n="confirmWithdraw">确认撤回</button>
            <button type="button" id="withdraw-cancel-button" class="modal-cancel-button" data-on-click="closeWithdrawModal" data-i18n="cancel">取消</button>
        </div>
    </div>
</div>

<!-- 牌局设置 Modal -->
<div id="game-settings-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content settings-modal-content">
        <div class="settings-modal-header">
            <h3><i class="fa-solid fa-sliders"></i> <span data-i18n="gameSettings">牌局设置</span></h3>
            <button class="settings-close-btn" data-on-click="closeGameSettings"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="settings-section">
            <div class="settings-section-title" data-i18n="chipAuthTitle">筹码操作授权</div>
            <p class="settings-section-desc" data-i18n="chipAuthDesc">开启后，局头可以替你买入筹码（直接计入你的买入，不用你提交申请）。</p>
            <div id="chip-auth-list" class="chip-auth-list">
                <div class="settings-loading" data-i18n="loading">加载中...</div>
            </div>
        </div>

        <!-- 未来可在此添加更多设置区块 -->

        <div id="settings-message" class="operation-message settings-message"></div>

        <div class="settings-modal-footer">
            <button class="settings-apply-btn" data-on-click="applyGameSettings" data-i18n="apply">应用</button>
        </div>

    </div>
</div>

<div id="game-toast" class="game-toast" role="status" aria-live="polite" hidden></div>

<div id="join-group-modal" class="custom-modal" style="display:none;">
    <div class="custom-modal-content">
        <h3 data-i18n="joinOtherGroup">加入其他组</h3>
        <p data-i18n="joinGroupLogoutConfirm">此操作会退出当前登录，是否确认？</p>
        <div class="custom-modal-actions">
            <button class="modal-confirm-button" data-on-click="confirmJoinGroup" data-i18n="confirm">确认</button>
            <button class="modal-cancel-button" data-on-click="closeJoinGroupModal" data-i18n="cancel">取消</button>
        </div>
    </div>
</div>

<script src="/static/js/common/actions.js?v={{ static_version }}"></script>
<script src="/static/js/common/escape.js?v={{ static_version }}"></script>
<script src="/static/js/common/text_format.js?v={{ static_version }}"></script>
<script src="/static/js/user/game/game_settings.js?v={{ static_version }}"></script>
<script src="/static/js/user/dashboard/group_join.js?v={{ static_version }}"></script>
<script src="/static/js/i18n/user.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/current_user.js?v={{ static_version }}"></script>
<script src="/static/js/common/logout.js?v={{ static_version }}"></script>
<script src="/static/js/common/sidebar.js?v={{ static_version }}"></script>
<script src="/static/js/user/game/game_api.js?v={{ static_version }}"></script>
<script src="/static/js/user/game/game_render.js?v={{ static_version }}"></script>
<script src="/static/js/user/game/game_init.js?v={{ static_version }}"></script>

</body>
</html>
