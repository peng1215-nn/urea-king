<button class="hamburger-btn" data-on-click="toggleSidebar" aria-label="menu">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="sidebar-overlay" data-on-click="closeSidebar"></div>

<div class="sidebar">

    <div class="logo">UREAKING</div>

    <div class="menu">

        <div class="menu-item {% if current_page == 'dashboard' %}active{% endif %}"
             data-href="/user-dashboard">
            <i class="fa-solid fa-house"></i>
            <span data-i18n="dashboard">控制台</span>
        </div>

        <div class="menu-item {% if current_page == 'game' %}active{% endif %}"
             data-href="/user-game">
            <i class="fa-solid fa-chess-board"></i>
            <span data-i18n="currentGame">当前牌局</span>
        </div>

        <div class="menu-item {% if current_page == 'game_logs' %}active{% endif %}"
             data-href="/user-game-logs">
            <i class="fa-regular fa-file-lines"></i>
            <span data-i18n="gameLogs">牌局日志</span>
        </div>

        <div class="menu-item" data-on-click="openJoinGroupModal">
            <i class="fa-solid fa-plus"></i>
            <span data-i18n="joinOtherGroup">加入其他组</span>
        </div>

        <div class="menu-item {% if current_page == 'change_password' %}active{% endif %}"
             data-href="/user-change-password">
            <i class="fa-solid fa-lock"></i>
            <span data-i18n="changePassword">修改密码</span>
        </div>

        <div class="menu-item sidebar-language-toggle" data-on-click="toggleLanguage" role="button">
            <i class="fa-solid fa-language"></i>
            <span class="sidebar-language-label">English</span>
        </div>

        <div class="menu-item" data-on-click="logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span data-i18n="logout">退出登录</span>
        </div>

    </div>

</div>
