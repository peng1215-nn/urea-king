<button class="hamburger-btn" data-on-click="toggleSidebar" aria-label="menu">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="sidebar-overlay" data-on-click="closeSidebar"></div>

<div class="sidebar">

    <div class="logo">
        UREAKING
        <div class="logo-sub">POKER</div>
    </div>

    <div class="menu">

        <div
                class="menu-item {% if current_page == 'dashboard' %}active{% endif %}"
                data-href="/admin-dashboard"
        >
            <i class="fa-solid fa-house"></i>

            <span data-i18n="console">
                控制台
            </span>
        </div>

        <div
                class="menu-item {% if current_page == 'system_monitor' %}active{% endif %}"
                data-href="/system-monitor"
        >
            <i class="fa-solid fa-chart-line"></i>

            <span data-i18n="systemMonitor">
                系统监控
            </span>
        </div>

        <div
                class="menu-item {% if current_page == 'user_management' %}active{% endif %}"
                data-href="/user-management"
        >
            <i class="fa-regular fa-user"></i>

            <span data-i18n="userManagement">
                用户管理
            </span>
        </div>

        <div
                class="menu-item {% if current_page == 'invite_management' %}active{% endif %}"
                data-href="/invite-management"
        >
            <i class="fa-solid fa-ticket"></i>

            <span data-i18n="inviteManagement">
                邀请码管理
            </span>
        </div>

        <div
                class="menu-item {% if current_page == 'game_logs' %}active{% endif %}"
                data-href="/admin-game-logs"
        >
            <i class="fa-solid fa-book"></i>
            <span data-i18n="gameLogs">
                牌局日志
            </span>
        </div>

        <div
                class="menu-item {% if current_page == 'system_logs' %}active{% endif %}"
                data-href="/system-logs"
        >
            <i class="fa-regular fa-file-lines"></i>

            <span data-i18n="systemLogs">
                系统日志
            </span>
        </div>

        <div
                class="menu-item {% if current_page == 'announcement_management' %}active{% endif %}"
                data-href="/announcement-management"
        >
            <i class="fa-solid fa-bullhorn"></i>

            <span data-i18n="announcementManagement">
                公告管理
            </span>
        </div>

        <div
                class="menu-item {% if current_page == 'change_password' %}active{% endif %}"
                data-href="/change-password"
        >
            <i class="fa-solid fa-lock"></i>

            <span data-i18n="changePassword">
                修改密码
            </span>
        </div>

        <div class="menu-item sidebar-language-toggle" data-on-click="toggleLanguage" role="button">
            <i class="fa-solid fa-language"></i>
            <span class="sidebar-language-label">English</span>
        </div>

        <div
            class="menu-item"
            data-on-click="logout"
        >
            <i class="fa-solid fa-right-from-bracket"></i>

            <span data-i18n="logout">
                退出登录
            </span>
        </div>

    </div>

</div>
