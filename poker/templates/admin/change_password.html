
<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleChangePassword">UREAKING-POKER</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/common/common.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/css/admin/change_password.css?v={{ static_version }}">

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main">

    <div class="top-bar">

        <div class="title-area">
            <h1 data-i18n="changePassword">修改密码</h1>

            <p
                class="page-subtitle"
                data-i18n="changePasswordPageDesc"
            >
                在此页面修改昵称与账户密码。
            </p>
        </div>

        <div class="topbar-actions">

            <img
                id="avatar-preview"
                class="avatar"
                src="/static/images/default_avatar.jpg"
                alt="avatar"
            >

            <div class="role-tag">
                <span class="status-dot"></span>

                <span data-i18n="admin">
                    管理员
                </span>
            </div>

        </div>

    </div>

    <div class="profile-grid">

        <!-- 修改昵称 -->
        <div class="profile-card">

            <div class="profile-card-header">
                <i class="fa-solid fa-user-pen"></i>

                <h2 data-i18n="updateNickname">
                    修改昵称
                </h2>
            </div>

            <p data-i18n="updateNicknameDesc">
                修改当前账户显示昵称。
            </p>

            <div class="form-group">

                <label data-i18n="currentNickname">
                    当前昵称
                </label>

                <input
                    type="text"
                    id="current-nickname"
                    class="form-input"
                    readonly
                >

            </div>

            <div class="form-group">

                <label
                    for="new-nickname"
                    data-i18n="newNickname"
                >
                    新昵称
                </label>

                <input
                    type="text"
                    id="new-nickname"
                    class="form-input"
                    maxlength="50"
                    data-i18n-placeholder="newNicknamePlaceholder"
                    placeholder="请输入新昵称"
                >

            </div>

            <div
                id="nickname-message"
                class="operation-message"
            ></div>

            <button
                class="btn-save"
                data-i18n="saveNickname"
                onclick="saveNickname()"
            >
                保存昵称
            </button>

        </div>

        <!-- 修改密码 -->
        <div class="profile-card">

            <div class="profile-card-header">
                <i class="fa-solid fa-lock"></i>

                <h2 data-i18n="changePassword">
                    修改密码
                </h2>
            </div>

            <p data-i18n="changePasswordFormDesc">
                修改密码需要输入当前密码。修改成功后将自动退出登录。
            </p>

            <div class="form-group">

                <label
                    for="current-password"
                    data-i18n="currentPassword"
                >
                    当前密码
                </label>

                <input
                    type="password"
                    id="current-password"
                    class="form-input"
                    data-i18n-placeholder="currentPasswordPlaceholder"
                    placeholder="请输入当前密码"
                >

            </div>

            <div class="form-group">

                <label
                    for="new-password"
                    data-i18n="newPassword"
                >
                    新密码
                </label>

                <input
                    type="password"
                    id="new-password"
                    class="form-input"
                    data-i18n-placeholder="newPasswordPlaceholder"
                    placeholder="请输入新密码"
                >

            </div>

            <div class="form-group">

                <label
                    for="confirm-password"
                    data-i18n="confirmNewPassword"
                >
                    确认新密码
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    class="form-input"
                    data-i18n-placeholder="confirmNewPasswordPlaceholder"
                    placeholder="请再次输入新密码"
                >

            </div>

            <div
                id="password-message"
                class="operation-message"
            ></div>

            <button
                class="btn-save btn-danger"
                data-i18n="changePassword"
                onclick="savePassword()"
            >
                修改密码
            </button>

        </div>

    </div>

</div>

<script src="/static/js/i18n/admin.js?v={{ static_version }}"></script>
<script src="/static/js/common/language.js?v={{ static_version }}"></script>
<script src="/static/js/common/current_user.js?v={{ static_version }}"></script>
<script src="/static/js/common/logout.js?v={{ static_version }}"></script>
<script src="/static/js/common/sidebar.js?v={{ static_version }}"></script>
<script src="/static/js/admin/change_password/change_password_api.js?v={{ static_version }}"></script>
<script src="/static/js/admin/change_password/change_password_actions.js?v={{ static_version }}"></script>
<script src="/static/js/admin/change_password/change_password_init.js?v={{ static_version }}"></script>

</body>
</html>
