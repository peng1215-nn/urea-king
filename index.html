<title>UREAKING</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap">

<style>
:root {
  --bg:       #080b10;
  --grid:     rgba(100, 180, 255, 0.04);
  --signal:   #4a9eff;
  --signal-2: rgba(74, 158, 255, 0.35);
  --text:     rgba(255,255,255,0.82);
  --muted:    rgba(255,255,255,0.28);
  --mono:     'Share Tech Mono', monospace;
  --sans:     'Inter', system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
}

#canvas { position: fixed; inset: 0; z-index: 0; }

.grid {
  position: fixed; inset: 0; z-index: 1;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 40%, transparent 100%);
}

.stage {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(32px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
}

.coord {
  font-family: var(--mono); font-size: 10px;
  color: var(--muted); letter-spacing: 2px;
  margin-bottom: 56px;
  opacity: 0; animation: fadein 1.2s ease forwards 0.4s;
}

.wordmark { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 20px; }

.wordmark-main {
  font-family: var(--mono);
  font-size: clamp(36px, 8vw, 72px);
  letter-spacing: 0.22em; color: #fff;
  opacity: 0; animation: risein 1.4s cubic-bezier(0.16,1,0.3,1) forwards 0.6s;
}

.wordmark-sub {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 5px; color: var(--signal); text-transform: uppercase;
  opacity: 0; animation: fadein 1s ease forwards 1.2s;
}

.descriptor {
  font-size: 13px; font-weight: 300; color: var(--muted);
  letter-spacing: 0.06em; text-align: center;
  max-width: 320px; line-height: 1.7; margin-bottom: 0;
  opacity: 0; animation: fadein 1s ease forwards 1.5s;
}

/* ── radar target ── */
#radar-target {
  position: fixed; z-index: 4;
  display: none; pointer-events: none;
  transform: translate(-50%, -50%);
  width: 80px; height: 80px;
  align-items: center; justify-content: center;
}

/* blip: drawn on canvas, no DOM dot needed */
#blip { display: none; }

/* planet button */
.planet-wrap {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
}
.enter-link {
  text-decoration: none;
  display: block;
  width: 68px; height: 68px;
  border-radius: 50%;
  position: relative;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 0 0 16px rgba(140,80,220,0.35), inset 0 0 24px rgba(40,10,80,0.7);
}
.enter-link:hover {
  transform: scale(1.08);
  box-shadow: 0 0 32px rgba(160,80,255,0.6), inset 0 0 30px rgba(40,10,80,0.7);
}
/* planet canvas drawn by JS */
#planet-canvas {
  width: 68px; height: 68px;
  border-radius: 50%;
  display: block;
}
.planet-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 3px; color: rgba(255,255,255,0.9);
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 0 8px rgba(180,120,255,0.9);
}

/* sweep-lit flicker on planet */
#radar-target.lit .enter-link {
  box-shadow: 0 0 40px rgba(160,80,255,0.95), 0 0 80px rgba(120,40,200,0.4), inset 0 0 30px rgba(40,10,80,0.7);
  transition: box-shadow 0.08s ease;
}

/* ── contact admin ── */
.contact-bar {
  position: fixed;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  left: 0; right: 0; z-index: 4;
  display: flex; justify-content: center;
  opacity: 0; animation: fadein 1s ease forwards 2.2s;
}
.contact-link {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 3px; color: var(--muted);
  text-decoration: none; text-transform: uppercase;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 2px;
  transition: color 0.3s, border-color 0.3s;
}
.contact-link:hover { color: var(--signal); border-color: var(--signal); }

/* ── animations ── */
@keyframes fadein {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes risein {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0.01ms !important; }
}
@media (max-width: 480px) {
  .coord { margin-bottom: 36px; }
}
</style>

<canvas id="canvas"></canvas>
<div class="grid"></div>

<div class="stage">
  <div class="coord" id="coord">0°00'00" N · 0°00'00" E</div>
  <div class="wordmark">
    <div class="wordmark-main">UREAKING</div>
    <div class="wordmark-sub">observer ecosystem</div>
  </div>
  <p class="descriptor">A multi-module web platform.</p>
</div>

<!-- radar target -->
<div id="radar-target">
  <div id="blip"><div id="blip-dot"></div></div>
  <div class="planet-wrap" id="planet-wrap">
    <a class="enter-link" id="enter-btn" href="https://poker.urea-king.com" target="_blank" rel="noopener">
      <canvas id="planet-canvas" width="88" height="88"></canvas>
      <div class="planet-label">POKER</div>
    </a>
  </div>
</div>

<!-- contact -->
<div class="contact-bar">
  <a class="contact-link" href="mailto:admin@urea-king.com">contact admin</a>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, particles;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}

function initParticles() {
  particles = Array.from({ length: 55 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.2 + 0.3,
    vx: (Math.random() - 0.5) * 0.18,
    vy: (Math.random() - 0.5) * 0.18,
    a: Math.random() * 0.5 + 0.1,
  }));
}

let angle = 0;
const SWEEP = 'rgba(74,158,255,';

// ── radar target state ──
const radarTarget = document.getElementById('radar-target');
let tAngle, tDist, tX, tY, tRevealed = false;

// safe zone: avoid center content block (ellipse) and screen edges
function placeTarget() {
  let tx, ty, attempts = 0;
  const edgeMargin = 120;
  const exW = 210;   // ellipse half-width (wordmark area)
  const exH = 160;   // ellipse half-height
  const planetR = 44;
  do {
    tAngle = Math.random() * Math.PI * 2;
    tDist  = (0.30 + Math.random() * 0.52) * Math.min(W, H) * 0.44;
    tx = cx + Math.cos(tAngle) * tDist;
    ty = cy + Math.sin(tAngle) * tDist;
    attempts++;
    const ddx = (tx - cx) / exW, ddy = (ty - cy) / exH;
    var inCenter = ddx*ddx + ddy*ddy < 1;
    var nearEdge = tx < edgeMargin + planetR || tx > W - edgeMargin - planetR ||
                   ty < edgeMargin + planetR || ty > H - edgeMargin - planetR;
  } while (attempts < 60 && (inCenter || nearEdge));
  tX = tx; tY = ty;
  radarTarget.style.left = tX + 'px';
  radarTarget.style.top  = tY + 'px';
}

function resetScene() {
  tRevealed = false;
  btnShown  = false;
  sweepPassCount = 0;
  blips.length = 0;
  radarTarget.style.display = 'none';
  radarTarget.style.pointerEvents = 'none';
  planetWrap.style.transition = 'none';
  planetWrap.style.opacity    = '0';
  radarTarget.classList.remove('lit');
  placeTarget();
}

function norm(a) { return ((a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2); }

const planetWrap = document.getElementById('planet-wrap');
let btnShown = false;

// ── blip afterglow: array of { x, y, alpha } ──
// each time sweep hits target a blip is stamped; alpha decays each frame
const blips = [];
const BLIP_DECAY = 0.97; // exponential decay multiplier per frame (phosphor afterglow curve)

function stampBlip() {
  // replace any existing blip at same position (keep max 1 per target)
  const existing = blips.findIndex(b => b.x === tX && b.y === tY);
  if (existing >= 0) blips[existing].alpha = 1.0;
  else blips.push({ x: tX, y: tY, alpha: 1.0 });
}

function drawBlips(maxR) {
  for (const b of blips) {
    if (b.alpha <= 0) continue;

    // outer soft glow (purple)
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 20);
    g.addColorStop(0,   `rgba(160,80,255,${b.alpha * 0.75})`);
    g.addColorStop(0.4, `rgba(130,50,220,${b.alpha * 0.35})`);
    g.addColorStop(1,   `rgba(100,20,180,0)`);
    ctx.beginPath(); ctx.arc(b.x, b.y, 20, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();

    // bright core dot (white-violet)
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
    ctx.fillStyle = `rgba(230,200,255,${b.alpha})`;
    ctx.fill();

    b.alpha = b.alpha * BLIP_DECAY;  // exponential: fast initial fade, long phosphor tail
  }
}

let sweepPassCount = 0;

function checkSweep() {
  const diff = norm(tAngle) - norm(angle);
  const hit  = diff > -0.08 && diff < 0.15;
  if (!hit) return;
  if (!tRevealed) {
    tRevealed = true;
    sweepPassCount = 1;
    stampBlip();
    // show target container immediately (for blip drawing position ref)
    radarTarget.style.display = 'flex';
    radarTarget.style.pointerEvents = 'none';
  } else {
    sweepPassCount++;
    stampBlip();
    // after 2nd sweep pass → start fading in the planet
    if (sweepPassCount === 2 && !btnShown) {
      btnShown = true;
      planetWrap.style.transition = 'opacity 1.4s ease';
      planetWrap.style.opacity = '1';
      setTimeout(() => { radarTarget.style.pointerEvents = 'auto'; }, 1400);
    } else if (btnShown) {
      // subsequent passes: pulse the planet glow
      radarTarget.classList.remove('lit');
      void radarTarget.offsetWidth;
      radarTarget.classList.add('lit');
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const maxR = Math.hypot(cx, cy) * 0.9;

  // rings
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, maxR / 4 * i, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(74,158,255,${0.04 + 0.01 * i})`;
    ctx.lineWidth = 1; ctx.stroke();
  }

  // crosshairs
  ctx.strokeStyle = 'rgba(74,158,255,0.06)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();

  // sweep wedge
  const sweepWidth = Math.PI * 0.18;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
  grad.addColorStop(0,   SWEEP + '0.0)');
  grad.addColorStop(0.5, SWEEP + '0.13)');
  grad.addColorStop(1,   SWEEP + '0.0)');
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.arc(0, 0, maxR, -sweepWidth, 0); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(maxR, 0);
  ctx.strokeStyle = SWEEP + '0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();

  // afterglow blips (canvas-drawn, decay naturally)
  drawBlips(maxR);

  // particles
  for (const p of particles) {
    const px = p.x - cx, py = p.y - cy;
    const pA = Math.atan2(py, px);
    const diff = (norm(pA) - norm(angle) + Math.PI * 2) % (Math.PI * 2);
    const lit = diff < 0.25;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (lit ? 2.2 : 1), 0, Math.PI * 2);
    ctx.fillStyle = lit
      ? `rgba(74,158,255,${Math.min(0.85, p.a * 3)})`
      : `rgba(255,255,255,${p.a * 0.35})`;
    ctx.fill();
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
  }

  checkSweep();
  angle += 0.004;
  requestAnimationFrame(draw);
}

// coord readout
const coordEl = document.getElementById('coord');
function updateCoord() {
  const d = new Date();
  const lat = (d.getSeconds() * 0.001 + 31.23).toFixed(4);
  const lon = (d.getSeconds() * 0.002 + 121.47).toFixed(4);
  coordEl.textContent = `${lat} N  /  ${lon} E`;
}
setInterval(updateCoord, 1200);

// ── draw planet ──
function drawPlanet() {
  const pc = document.getElementById('planet-canvas');
  pc.width = 68; pc.height = 68;
  const c  = pc.getContext('2d');
  const S  = 68;
  c.clearRect(0, 0, S, S);

  // clip to circle
  c.save();
  c.beginPath(); c.arc(S/2, S/2, S/2, 0, Math.PI*2); c.clip();

  // base: deep space purple-black
  const base = c.createRadialGradient(S*0.38, S*0.32, 2, S/2, S/2, S/2);
  base.addColorStop(0,   '#2a1450');
  base.addColorStop(0.5, '#150830');
  base.addColorStop(1,   '#08030f');
  c.fillStyle = base; c.fillRect(0, 0, S, S);

  // nebula cloud patches (purple/violet haze)
  const clouds = [
    { x: 18, y: 20, rx: 16, ry: 10, a: 0.13, col: [140,60,220] },
    { x: 44, y: 14, rx: 14, ry: 8,  a: 0.09, col: [160,80,255] },
    { x: 10, y: 42, rx: 12, ry: 7,  a: 0.10, col: [100,40,180] },
    { x: 46, y: 40, rx: 13, ry: 8,  a: 0.08, col: [180,80,255] },
    { x: 26, y: 52, rx: 15, ry: 7,  a: 0.11, col: [120,50,200] },
  ];
  for (const cl of clouds) {
    const ng = c.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, Math.max(cl.rx, cl.ry));
    ng.addColorStop(0,   `rgba(${cl.col},${cl.a})`);
    ng.addColorStop(1,   `rgba(${cl.col},0)`);
    c.save(); c.scale(1, cl.ry/cl.rx);
    c.beginPath(); c.arc(cl.x, cl.y * (cl.rx/cl.ry), cl.rx, 0, Math.PI*2);
    c.fillStyle = ng; c.fill(); c.restore();
  }

  // atmosphere bands (faint violet stripes)
  const bands = [
    { y: 16, h: 5,  a: 0.09, col: [150,70,255] },
    { y: 30, h: 9,  a: 0.06, col: [120,50,200] },
    { y: 46, h: 7,  a: 0.07, col: [170,90,255] },
    { y: 60, h: 10, a: 0.05, col: [100,40,180] },
  ];
  for (const b of bands) {
    c.fillStyle = `rgba(${b.col},${b.a})`;
    c.fillRect(0, b.y, S, b.h);
  }

  // specular highlight (cool white-violet)
  const spec = c.createRadialGradient(S*0.3, S*0.26, 0, S*0.36, S*0.33, S*0.32);
  spec.addColorStop(0,   'rgba(230,200,255,0.22)');
  spec.addColorStop(0.5, 'rgba(200,160,255,0.06)');
  spec.addColorStop(1,   'rgba(200,160,255,0)');
  c.fillStyle = spec; c.fillRect(0, 0, S, S);

  // limb darkening
  const limb = c.createRadialGradient(S/2, S/2, S*0.3, S/2, S/2, S/2);
  limb.addColorStop(0,   'rgba(0,0,0,0)');
  limb.addColorStop(0.7, 'rgba(0,0,0,0.1)');
  limb.addColorStop(1,   'rgba(0,0,0,0.6)');
  c.fillStyle = limb; c.fillRect(0, 0, S, S);

  c.restore();

  // outer glow ring (purple)
  const ring = c.createRadialGradient(S/2, S/2, S/2-1, S/2, S/2, S/2+8);
  ring.addColorStop(0,   'rgba(150,70,255,0.45)');
  ring.addColorStop(0.5, 'rgba(120,40,200,0.15)');
  ring.addColorStop(1,   'rgba(120,40,200,0)');
  c.beginPath(); c.arc(S/2, S/2, S/2+4, 0, Math.PI*2);
  c.fillStyle = ring; c.fill();
}

drawPlanet();
resize(); resetScene(); initParticles(); draw();
window.addEventListener('resize', () => { resize(); resetScene(); initParticles(); });

// re-run full scan when tab becomes visible again (close→reopen)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) resetScene();
});
</script>
