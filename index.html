<title>UREAKING</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js" defer></script>

<style>
:root {
  --bg:       #080b10;
  --grid:     rgba(100, 180, 255, 0.04);
  --signal:   #4a9eff;
  --signal-2: rgba(74, 158, 255, 0.35);
  --text:     rgba(255,255,255,0.82);
  --muted:    rgba(255,255,255,0.28);
  --mono:     'Share Tech Mono', monospace;
  --sans:     'Inter', system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
}

#canvas { position: fixed; inset: 0; z-index: 0; }
#nova-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

.grid {
  position: fixed; inset: 0; z-index: 1;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 40%, transparent 100%);
}

.stage {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(32px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
}

.coord {
  font-family: var(--mono); font-size: clamp(11px, 2.5vw, 13px);
  color: var(--muted); letter-spacing: 2px;
  margin-bottom: 56px;
  opacity: 0; animation: fadein 1.2s ease forwards 0.4s;
}

.wordmark { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 20px; }

.wordmark-main {
  font-family: var(--mono);
  font-size: clamp(36px, 8vw, 72px);
  letter-spacing: 0.22em; color: #fff;
  opacity: 0; animation: risein 1.4s cubic-bezier(0.16,1,0.3,1) forwards 0.6s;
}

.wordmark-sub {
  font-family: var(--mono); font-size: clamp(12px, 2.8vw, 14px);
  letter-spacing: 5px; color: var(--signal); text-transform: uppercase;
  opacity: 0; animation: fadein 1s ease forwards 1.2s;
}

.descriptor {
  font-size: clamp(14px, 3vw, 15px); font-weight: 300; color: var(--muted);
  letter-spacing: 0.06em; text-align: center;
  max-width: 320px; line-height: 1.7; margin-bottom: 0;
  opacity: 0; animation: fadein 1s ease forwards 1.5s;
}

/* ── radar target ── */
#radar-target {
  position: fixed; z-index: 4;
  display: none; pointer-events: none;
  transform: translate(-50%, -50%);
  width: 80px; height: 80px;
  align-items: center; justify-content: center;
}

/* blip: drawn on canvas, no DOM dot needed */
#blip { display: none; }

/* planet button */
.planet-wrap {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
}
.enter-link {
  text-decoration: none;
  display: block;
  width: 68px; height: 68px;
  border-radius: 50%;
  position: relative;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 0 0 16px rgba(140,80,220,0.35), inset 0 0 24px rgba(40,10,80,0.7);
}
.enter-link:hover {
  transform: scale(1.08);
  box-shadow: 0 0 32px rgba(160,80,255,0.6), inset 0 0 30px rgba(40,10,80,0.7);
}
/* planet canvas drawn by JS */
#planet-canvas {
  width: 68px; height: 68px;
  border-radius: 50%;
  display: block;
}
.planet-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 3px; color: rgba(255,255,255,0.9);
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 0 8px rgba(180,120,255,0.9);
}

/* sweep-lit flicker handled by JS */

/* ── contact admin ── */
.contact-bar {
  position: fixed;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  left: 0; right: 0; z-index: 6;
  display: flex; justify-content: center;
  opacity: 0; animation: fadein 1s ease forwards 2.2s;
}
.contact-link {
  font-family: var(--mono); font-size: clamp(12px, 3vw, 14px);
  letter-spacing: 3px; color: var(--muted);
  background: none; border: none; cursor: pointer;
  text-transform: uppercase;
  border-bottom: 1px solid rgba(255,255,255,0.18);
  padding: 4px 2px 4px 2px;
  transition: color 0.3s, border-color 0.3s;
}
.contact-link:hover { color: var(--signal); border-color: var(--signal); }

/* ── contact modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(4, 6, 12, 0.85);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
  padding: max(16px, env(safe-area-inset-left, 0px));
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal {
  width: 100%; max-width: 400px;
  background: rgba(12, 16, 28, 0.96);
  border: 1px solid rgba(150, 80, 255, 0.2);
  border-radius: 4px;
  padding: 30px 26px 24px;
  transform: translateY(12px);
  transition: transform 0.25s ease;
  box-shadow: 0 0 60px rgba(120,40,200,0.15);
}
.modal-overlay.open .modal { transform: translateY(0); }

.modal-title {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 4px; color: rgba(150,80,255,0.9);
  text-transform: uppercase; margin-bottom: 20px;
}

.modal-email-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 22px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 2px;
}
.modal-email {
  font-family: var(--mono); font-size: 13px;
  color: rgba(180,130,255,0.9); flex: 1;
  user-select: all;
}
.btn-copy {
  font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
  color: var(--muted); background: none;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 2px; cursor: pointer;
  text-transform: uppercase; padding: 4px 8px;
  transition: color 0.2s, border-color 0.2s; white-space: nowrap;
}
.btn-copy:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

.modal-label {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 3px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 10px;
}
.modal-template {
  font-family: var(--mono); font-size: 12px; line-height: 1.8;
  color: rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 2px; padding: 12px 14px;
  margin-bottom: 22px;
}
.modal-template span { color: rgba(150,80,255,0.8); }

.modal-actions {
  display: flex; justify-content: flex-end;
}
.btn-close {
  font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
  color: var(--muted); background: none; border: none;
  cursor: pointer; text-transform: uppercase; padding: 8px 4px;
  transition: color 0.2s;
}
.btn-close:hover { color: var(--text); }

/* ── animations ── */
@keyframes fadein {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes risein {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0.01ms !important; }
}
@media (max-width: 600px) {
  .stage {
    justify-content: flex-start;
    padding-top: max(72px, env(safe-area-inset-top, 0px));
  }
  .coord {
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 24px;
  }
  .wordmark-main {
    font-size: 48px;
    letter-spacing: 0.18em;
  }
  .wordmark-sub {
    font-size: 13px;
    letter-spacing: 4px;
  }
  .wordmark {
    margin-bottom: 14px;
  }
  .descriptor {
    font-size: 15px;
    max-width: 280px;
  }
  .contact-bar {
    bottom: max(28px, env(safe-area-inset-bottom, 0px));
  }
  .contact-link {
    font-size: 15px;
    letter-spacing: 4px;
    padding: 10px 6px;
    border-bottom-width: 1.5px;
    color: rgba(255,255,255,0.5);
  }
  .enter-link {
    width: 62px; height: 62px;
  }
  #planet-canvas {
    width: 62px; height: 62px;
  }
  .planet-label {
    font-size: 12px;
    letter-spacing: 4px;
  }
  .modal {
    padding: 24px 20px 20px;
    margin: 0 8px;
  }
  .modal-title { font-size: 12px; letter-spacing: 5px; }
  .modal-email { font-size: 14px; }
  .modal-template { font-size: 13px; }
  .btn-copy { font-size: 11px; padding: 5px 10px; }
  .btn-close { font-size: 12px; }
}

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, particles;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}

function initParticles() {
  particles = Array.from({ length: 55 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.2 + 0.3,
    vx: (Math.random() - 0.5) * 0.18,
    vy: (Math.random() - 0.5) * 0.18,
    a: Math.random() * 0.5 + 0.1,
  }));
}

let angle = 0;
const SWEEP = 'rgba(74,158,255,';

// ── radar target state ──
const radarTarget = document.getElementById('radar-target');
let tAngle, tDist, tX, tY, tRevealed = false;

// safe zone: avoid center content block (ellipse) and screen edges
function placeTarget() {
  let tx, ty, attempts = 0;
  const isMobile = W < 600;
  const edgeMargin = Math.min(80, W * 0.12);
  const exW = Math.min(210, W * 0.32);
  const exH = Math.min(160, H * 0.22);
  const planetR = 40;
  do {
    if (isMobile) {
      // mobile: place in lower 55% of screen
      tx = edgeMargin + planetR + Math.random() * (W - 2 * (edgeMargin + planetR));
      ty = H * 0.45 + Math.random() * (H * 0.45);
      tAngle = Math.atan2(ty - cy, tx - cx);
      tDist  = Math.hypot(tx - cx, ty - cy);
    } else {
      tAngle = Math.random() * Math.PI * 2;
      tDist  = (0.30 + Math.random() * 0.52) * Math.min(W, H) * 0.44;
      tx = cx + Math.cos(tAngle) * tDist;
      ty = cy + Math.sin(tAngle) * tDist;
    }
    attempts++;
    const ddx = (tx - cx) / exW, ddy = (ty - cy) / exH;
    var inCenter = ddx*ddx + ddy*ddy < 1;
    var nearEdge = tx < edgeMargin + planetR || tx > W - edgeMargin - planetR ||
                   ty < edgeMargin + planetR || ty > H - edgeMargin - planetR;
  } while (attempts < 60 && (inCenter || nearEdge));
  tX = tx; tY = ty;
  radarTarget.style.left = tX + 'px';
  radarTarget.style.top  = tY + 'px';
}

function resetScene() {
  tRevealed = false;
  btnShown  = false;
  sweepPassCount = 0;
  lastCountedAngle = null;
  if (typeof tX !== 'undefined') SupernovaEngine.resetPlanet(tX, tY);
  blips.length = 0;
  radarTarget.style.display = 'none';
  radarTarget.style.pointerEvents = 'none';
  planetWrap.style.transition = 'none';
  planetWrap.style.opacity    = '0';
  radarTarget.classList.remove('lit');
  placeTarget();
}

function norm(a) { return ((a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2); }

const planetWrap = document.getElementById('planet-wrap');
let btnShown = false;

// ── blip afterglow: array of { x, y, alpha } ──
// each time sweep hits target a blip is stamped; alpha decays each frame
const blips = [];
const BLIP_DECAY = 0.97; // exponential decay multiplier per frame (phosphor afterglow curve)

function stampBlip() {
  // replace any existing blip at same position (keep max 1 per target)
  const existing = blips.findIndex(b => b.x === tX && b.y === tY);
  if (existing >= 0) blips[existing].alpha = 1.0;
  else blips.push({ x: tX, y: tY, alpha: 1.0 });
}

function drawBlips(maxR) {
  for (const b of blips) {
    if (b.alpha <= 0) continue;

    // outer soft glow (purple)
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 20);
    g.addColorStop(0,   `rgba(160,80,255,${b.alpha * 0.75})`);
    g.addColorStop(0.4, `rgba(130,50,220,${b.alpha * 0.35})`);
    g.addColorStop(1,   `rgba(100,20,180,0)`);
    ctx.beginPath(); ctx.arc(b.x, b.y, 20, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();

    // bright core dot (white-violet)
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
    ctx.fillStyle = `rgba(230,200,255,${b.alpha})`;
    ctx.fill();

    b.alpha = b.alpha * BLIP_DECAY;  // exponential: fast initial fade, long phosphor tail
  }
}

let sweepPassCount = 0;
let lastCountedAngle = null; // guard: only count once per revolution

// ── SupernovaEngine: WebGL-based 5-phase supernova ──
const SupernovaEngine = (() => {
  let renderer, scene, camera, composer;
  let novaCanvas, W2, H2;
  let THREE_loaded = false;

  // Per-planet state
  const planets = new Map(); // key: "x,y" → { phase, animT, animating, mesh refs... }

  // EffectComposer / UnrealBloom polyfill via manual ping-pong bloom
  // (use additive blending + glow layers to simulate bloom without addon dependency)

  function init() {
    novaCanvas = document.getElementById('nova-canvas');
    W2 = novaCanvas.width  = window.innerWidth;
    H2 = novaCanvas.height = window.innerHeight;

    renderer = new THREE.WebGLRenderer({ canvas: novaCanvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W2, H2);
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;

    scene  = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-W2/2, W2/2, H2/2, -H2/2, -1000, 1000);
    camera.position.z = 100;

    THREE_loaded = true;
    animate();
  }

  function resize() {
    if (!THREE_loaded) return;
    W2 = novaCanvas.width  = window.innerWidth;
    H2 = novaCanvas.height = window.innerHeight;
    renderer.setSize(W2, H2);
    camera.left  = -W2/2; camera.right = W2/2;
    camera.top   =  H2/2; camera.bottom = -H2/2;
    camera.updateProjectionMatrix();
  }

  // Convert screen coords to Three.js world coords (orthographic, origin at center)
  function toWorld(sx, sy) {
    return new THREE.Vector2(sx - W2/2, -(sy - H2/2));
  }

  // ── Phase objects pool ──
  function makePlanetState(sx, sy) {
    const key = sx + ',' + sy;
    if (planets.has(key)) return planets.get(key);
    const state = {
      sx, sy,
      phase: 0,        // 0=idle, 1-5=phases
      animStart: 0,
      group: new THREE.Group(),
      meshes: [],      // disposable meshes per phase
      nebulaParts: [], // for phase 4
      shockwaves: [],  // rings for phase 3
    };
    const wp = toWorld(sx, sy);
    state.group.position.set(wp.x, wp.y, 0);
    scene.add(state.group);
    planets.set(key, state);
    return state;
  }

  // dispose all phase meshes
  function clearMeshes(state) {
    for (const m of state.meshes) {
      if (m.geometry) m.geometry.dispose();
      if (m.material) m.material.dispose();
      state.group.remove(m);
    }
    state.meshes = [];
    state.nebulaParts = [];
    state.shockwaves = [];
  }

  // ────────────────────────────────
  // PHASE 1: Energy accumulation — blue-white corona + inward particles
  // ────────────────────────────────
  function startPhase1(state) {
    clearMeshes(state);
    // Soft outer corona halo
    const coronaGeo = new THREE.CircleGeometry(120, 64);
    const coronaMat = new THREE.MeshBasicMaterial({
      color: 0x88ccff,
      transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const corona = new THREE.Mesh(coronaGeo, coronaMat);
    state.group.add(corona); state.meshes.push(corona);

    // Sparse inward energy motes — subtle, not chaotic
    const count = 48;
    const positions = new Float32Array(count * 3);
    const progArr   = new Float32Array(count);
    const angArr    = new Float32Array(count);
    const radArr    = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      angArr[i] = Math.random() * Math.PI * 2;
      radArr[i] = 38 + Math.random() * 42;
      progArr[i] = Math.random();
      positions[i*3]   = Math.cos(angArr[i]) * radArr[i] * (1 - progArr[i]);
      positions[i*3+1] = Math.sin(angArr[i]) * radArr[i] * (1 - progArr[i]);
      positions[i*3+2] = 0;
    }
    const ptGeo = new THREE.BufferGeometry();
    ptGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const ptMat = new THREE.PointsMaterial({
      color: 0xaaccff, size: 1.6,
      transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const pts = new THREE.Points(ptGeo, ptMat);
    state.group.add(pts); state.meshes.push(pts);

    state._p1 = { corona, coronaMat, pts, ptGeo, positions, progArr, angArr, radArr, count };
  }

  function updatePhase1(state, t) {
    const p = state._p1; if (!p) return;
    // Slow, gentle pulse — 0.5 cycle per second
    const pulse = 0.5 + 0.5 * Math.sin(t * 3.2);
    const fadeIn = Math.min(t / 2, 1); // ease in over 2 seconds
    // Very subtle corona shimmer
    p.coronaMat.opacity = (0.04 + 0.025 * pulse) * fadeIn;
    p.corona.scale.setScalar(0.9 + 0.12 * pulse);
    // Particles slowly spiral inward
    const pos = p.positions;
    for (let i = 0; i < p.count; i++) {
      p.progArr[i] = (p.progArr[i] + 0.0008) % 1;
      const r = p.radArr[i] * (1 - p.progArr[i]);
      p.angArr[i] += 0.008;
      pos[i*3]   = Math.cos(p.angArr[i]) * r;
      pos[i*3+1] = Math.sin(p.angArr[i]) * r;
    }
    p.ptGeo.attributes.position.needsUpdate = true;
    p.pts.material.opacity = (0.3 + 0.2 * pulse) * fadeIn;
  }

  // ────────────────────────────────
  // PHASE 2: Core collapse — star shrinks to white point, space darkens
  // ────────────────────────────────
  function startPhase2(state) {
    clearMeshes(state);
    // Dark veil (darken surroundings)
    const veilGeo = new THREE.CircleGeometry(200, 64);
    const veilMat = new THREE.MeshBasicMaterial({
      color: 0x000008, transparent: true, opacity: 0,
      blending: THREE.NormalBlending, depthWrite: false,
    });
    const veil = new THREE.Mesh(veilGeo, veilMat);
    state.group.add(veil); state.meshes.push(veil);

    // Core contracting sphere
    const coreGeo = new THREE.CircleGeometry(1, 32);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    state.group.add(core); state.meshes.push(core);

    // Outer glow around contracting core
    const glowGeo = new THREE.CircleGeometry(1, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x4488ff, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    state.group.add(glow); state.meshes.push(glow);

    state._p2 = { veil, veilMat, core, coreMat, glow, glowMat };
  }

  function updatePhase2(state, t) {
    const p = state._p2; if (!p) return;
    // First 0.6: collapse inward
    const collapse = Math.min(t / 0.6, 1);
    const ease = 1 - Math.pow(1 - collapse, 3);
    // Core goes from planet size (34px) to tiny white dot
    const coreR = 34 * (1 - ease) + 2;
    p.coreMat.opacity = Math.min(t * 4, 1);
    p.core.scale.setScalar(coreR);
    // Glow around core
    p.glowMat.opacity = ease * 0.6;
    p.glow.scale.setScalar(coreR * 3);
    // Dark veil builds up
    p.veilMat.opacity = ease * 0.55;
    p.veil.scale.setScalar(1 + ease * 0.5);
  }

  // ────────────────────────────────
  // PHASE 3: Explosion — shockwaves + bloom flash + particle jets
  // ────────────────────────────────
  function startPhase3(state) {
    clearMeshes(state);
    // Flash: layered radial glow — white core, blue mid, purple outer
    const flashLayers = [
      { r: 120,  color: 0xffffff, peakOp: 1.0  }, // white-hot core
      { r: 320,  color: 0xaaccff, peakOp: 0.80 }, // blue halo
      { r: 600,  color: 0x7744dd, peakOp: 0.40 }, // purple mid bloom
      { r: 900,  color: 0x441188, peakOp: 0.18 }, // deep violet outer
    ];
    const flashMeshes = [];
    for (const fl of flashLayers) {
      const g = new THREE.CircleGeometry(fl.r, 64);
      const m = new THREE.MeshBasicMaterial({
        color: fl.color, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false,
      });
      const mesh = new THREE.Mesh(g, m);
      mesh.userData.peakOp = fl.peakOp;
      state.group.add(mesh); state.meshes.push(mesh);
      flashMeshes.push(mesh);
    }
    const flash = flashMeshes[0]; // used only as handle; opacity set per-layer below
    const flashMat = flash.material; // kept for compat reference

    // Shockwave rings — each expands continuously until fully transparent
    const rings = [];
    const ringCount = 5;
    for (let i = 0; i < ringCount; i++) {
      const rGeo = new THREE.RingGeometry(1, 1.055, 96);
      const ringColors = [0xeef5ff, 0xaaddff, 0xff9944, 0xff5511, 0xcc2200];
      const rMat = new THREE.MeshBasicMaterial({
        color: ringColors[i],
        transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      });
      const ring = new THREE.Mesh(rGeo, rMat);
      // delay: stagger launch; speed: px/t-unit; fadeDur: how long fade takes
      ring.userData.delay   = i * 0.14;
      ring.userData.speed   = 190 + i * 36;   // px per second
      ring.userData.peakR   = 30 + i * 12;    // radius at peak brightness
      ring.userData.peakOp  = [0.9, 0.8, 0.7, 0.6, 0.5][i];
      state.group.add(ring); state.meshes.push(ring);
      rings.push(ring); state.shockwaves.push(ring);
    }

    // Particle jets — high-speed streaks outward
    const jCount = 400;
    const jPos  = new Float32Array(jCount * 3);
    const jVel  = new Float32Array(jCount * 3);
    const jLife = new Float32Array(jCount);
    const jDel  = new Float32Array(jCount);
    for (let i = 0; i < jCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2.5 + Math.random() * 5.5;
      jVel[i*3]   = Math.cos(a) * sp;
      jVel[i*3+1] = Math.sin(a) * sp;
      jVel[i*3+2] = 0;
      jPos[i*3] = jPos[i*3+1] = jPos[i*3+2] = 0;
      jLife[i] = 0;
      jDel[i]  = Math.random() * 0.25;
    }
    const jGeo = new THREE.BufferGeometry();
    jGeo.setAttribute('position', new THREE.BufferAttribute(jPos, 3));
    const jMat = new THREE.PointsMaterial({
      color: 0xffffff, size: 3,
      transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const jets = new THREE.Points(jGeo, jMat);
    state.group.add(jets); state.meshes.push(jets);

    state._p3 = { flash, flashMat, flashMeshes, rings, jets, jGeo, jPos, jVel, jLife, jDel, jCount };
  }

  function updatePhase3(state, ms) {
    // ms = raw elapsed milliseconds (unclamped) so rings expand forever
    const p = state._p3; if (!p) return;
    const t = ms / 1000; // seconds

    // Flash: ramp up 0-500ms, fade 500-3200ms — applied per-layer with individual peak opacity
    // Flash: fast ramp 0-300ms, hold bright 300-1500ms, slow fade 1500-5500ms
    const flashRatio = ms < 300
      ? (ms / 300)
      : ms < 1500 ? 1.0
      : ms < 5500 ? (1 - (ms - 1500) / 4000)
      : 0;
    for (const fm of p.flashMeshes) {
      fm.material.opacity = flashRatio * fm.userData.peakOp;
    }

    // Shockwave rings: expand continuously until fully transparent — NO cap
    for (const ring of p.rings) {
      const delayMs = ring.userData.delay * 1000;
      if (ms < delayMs) continue;
      const localMs = ms - delayMs;
      // speed in px/second
      const r = Math.max(1, localMs / 1000 * ring.userData.speed);
      ring.scale.setScalar(r);
      // riseR: radius at peak brightness; then linear fade to 0 at maxFadeR
      const riseR    = ring.userData.peakR;
      const maxFadeR = ring.userData.speed * 4.5; // fully gone by this radius
      const opacity  = r < riseR
        ? (r / riseR) * ring.userData.peakOp
        : ring.userData.peakOp * Math.max(0, 1 - (r - riseR) / (maxFadeR - riseR));
      ring.material.opacity = opacity;
    }

    // Jet particles
    const pos = p.jPos; const vel = p.jVel;
    for (let i = 0; i < p.jCount; i++) {
      if (t < p.jDel[i]) continue;
      p.jLife[i] += 0.018;
      pos[i*3]   += vel[i*3];
      pos[i*3+1] += vel[i*3+1];
    }
    p.jGeo.attributes.position.needsUpdate = true;
    const jetFade = ms < 500 ? ms / 500 : Math.max(0, 1 - (ms - 500) / 3000);
    p.jets.material.opacity = jetFade * 0.85;
    if (ms < 1000)      p.jets.material.color.setHex(0xffffff);
    else if (ms < 2500) p.jets.material.color.setHex(0x88aaff);
    else                p.jets.material.color.setHex(0xaa66ff);
  }

  // ────────────────────────────────
  // PHASE 4: Nebula expansion — rolling gas clouds
  // ────────────────────────────────
  function startPhase4(state) {
    clearMeshes(state);
    const partCount = 300;
    const parts = [];
    const colors = [
      0x3366ff, 0x6633ff, 0xff6633, 0xff3366,
      0xaa44ff, 0xff9944, 0x44aaff,
    ];
    for (let i = 0; i < partCount; i++) {
      const a   = Math.random() * Math.PI * 2;
      const spd = 0.18 + Math.random() * 0.55;
      const geo = new THREE.CircleGeometry(6 + Math.random() * 18, 16);
      const mat = new THREE.MeshBasicMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false,
      });
      const m = new THREE.Mesh(geo, mat);
      m.userData = {
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        rot: (Math.random() - 0.5) * 0.04,
        delay: Math.random() * 0.35,
        maxOpacity: 0.08 + Math.random() * 0.18,
        spin: (Math.random() - 0.5) * 0.02,
      };
      state.group.add(m); state.meshes.push(m);
      state.nebulaParts.push(m); parts.push(m);
    }
    state._p4 = { parts };
  }

  function updatePhase4(state, t) {
    const p = state._p4; if (!p) return;
    for (const m of p.parts) {
      const d = m.userData.delay;
      if (t < d) continue;
      const local = (t - d) / (1 - d);
      m.position.x += m.userData.vx * 1.8;
      m.position.y += m.userData.vy * 1.8;
      m.rotation.z += m.userData.spin;
      // fade in then plateau
      const fadeIn = Math.min(local / 0.2, 1);
      m.material.opacity = fadeIn * m.userData.maxOpacity;
    }
  }

  function sustainPhase4(state) {
    // Very slow drift while sustained (between sweeps)
    for (const m of state.nebulaParts) {
      m.position.x += m.userData.vx * 0.12;
      m.position.y += m.userData.vy * 0.12;
      m.rotation.z += m.userData.spin * 0.3;
    }
  }

  // ────────────────────────────────
  // PHASE 5: Fade out — nebula disperses, star returns
  // ────────────────────────────────
  function startPhase5(state) {
    // Don't clear — fade out existing nebula + shockwave remnants
    state._p5 = { startOpacities: state.nebulaParts.map(m => m.material.opacity) };
  }

  function updatePhase5(state, t) {
    const p = state._p5; if (!p) return;
    const fade = 1 - t;
    for (let i = 0; i < state.nebulaParts.length; i++) {
      const m = state.nebulaParts[i];
      m.material.opacity = (p.startOpacities[i] || 0) * fade;
      m.position.x += m.userData.vx * 0.08;
      m.position.y += m.userData.vy * 0.08;
    }
  }

  // ────────────────────────────────
  // Main animation loop
  // ────────────────────────────────
  const PHASE_DURATION = {
    1: 99999, // sustained until next sweep
    2: 99999,
    3: 5500,  // ms — rings need time to fully expand and fade
    4: 99999,
    5: 3000,
  };

  function animate() {
    requestAnimationFrame(animate);
    if (!THREE_loaded) return;
    const now = performance.now();

    for (const [, state] of planets) {
      if (state.phase === 0) continue;
      const elapsed = now - state.animStart;
      const t = Math.min(elapsed / PHASE_DURATION[state.phase], 1);

      switch (state.phase) {
        case 1: updatePhase1(state, elapsed / 1000); break;
        case 2: updatePhase2(state, t); break;
        case 3: updatePhase3(state, elapsed); break; // phase3 gets raw ms, not clamped t
        case 4:
          if (t < 1) updatePhase4(state, t);
          else sustainPhase4(state);
          break;
        case 5:
          updatePhase5(state, t);
          if (t >= 1) { clearMeshes(state); state.phase = 0; }
          break;
      }
    }

    renderer.render(scene, camera);
  }

  // ────────────────────────────────
  // Public API
  // ────────────────────────────────
  function onSweep(sx, sy) {
    if (!THREE_loaded) return;
    const state = makePlanetState(sx, sy);
    const nextPhase = state.phase === 0 ? 1 : (state.phase % 5) + 1;
    state.phase = nextPhase;
    state.animStart = performance.now();

    switch (nextPhase) {
      case 1: startPhase1(state); break;
      case 2: startPhase2(state); break;
      case 3: startPhase3(state); break;
      case 4: startPhase4(state); break;
      case 5: startPhase5(state); break;
    }
  }

  function resetPlanet(sx, sy) {
    const key = sx + ',' + sy;
    const state = planets.get(key);
    if (state) { clearMeshes(state); state.phase = 0; }
  }

  function onResize() { resize(); }

  // Wait for THREE to load then init
  function tryInit() {
    if (typeof THREE !== 'undefined') { init(); }
    else { setTimeout(tryInit, 50); }
  }
  setTimeout(tryInit, 0);

  return { onSweep, resetPlanet, onResize };
})();

function checkSweep() {
  const diff = norm(tAngle) - norm(angle);
  const hit  = diff > -0.08 && diff < 0.15;
  if (!hit) return;
  // guard: only count once per revolution (require ≥80% of 2π between counts)
  const canCount = lastCountedAngle === null ||
                   Math.abs(angle - lastCountedAngle) > Math.PI * 1.6;

  if (!tRevealed) {
    tRevealed = true;
    sweepPassCount = 1;
    lastCountedAngle = angle;
    stampBlip();
    radarTarget.style.display = 'flex';
    radarTarget.style.pointerEvents = 'none';
    // Show POKER on first scan — no supernova yet
    if (!btnShown) {
      btnShown = true;
      planetWrap.style.transition = 'opacity 1.4s ease';
      planetWrap.style.opacity = '1';
      setTimeout(() => { radarTarget.style.pointerEvents = 'auto'; }, 1400);
    }
  } else if (canCount) {
    sweepPassCount++;
    lastCountedAngle = angle;
    stampBlip();
    if (btnShown) {
      // flash planet and label
      const el = document.getElementById('enter-btn');
      const lbl = document.querySelector('.planet-label');
      el.style.transition = 'none';
      lbl.style.transition = 'none';
      el.style.filter = 'brightness(3) drop-shadow(0 0 20px rgba(210,150,255,1))';
      lbl.style.color = '#fff';
      lbl.style.textShadow = '0 0 20px rgba(220,180,255,1), 0 0 40px rgba(180,120,255,0.9)';
      lbl.style.letterSpacing = '5px';
      setTimeout(() => {
        el.style.transition = 'filter 0.6s ease-out';
        lbl.style.transition = 'all 0.6s ease-out';
        el.style.filter = 'brightness(1) drop-shadow(0 0 4px rgba(140,80,230,0.3))';
        lbl.style.color = 'rgba(255,255,255,0.9)';
        lbl.style.textShadow = '0 0 8px rgba(180,120,255,0.9)';
        lbl.style.letterSpacing = '3px';
      }, 60);

      // trigger supernova phase advance on every sweep after planet shown
      SupernovaEngine.onSweep(tX, tY);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const maxR = W < 600
    ? Math.hypot(W, H) * 0.6
    : Math.hypot(cx, cy) * 0.9;

  // rings
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, maxR / 4 * i, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(74,158,255,${0.04 + 0.01 * i})`;
    ctx.lineWidth = 1; ctx.stroke();
  }

  // crosshairs
  ctx.strokeStyle = 'rgba(74,158,255,0.06)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();

  // afterglow blips first (below sweep line)
  drawBlips(maxR);

  // sweep wedge on top
  const isMob = W < 600;
  const sweepWidth = Math.PI * 0.18;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
  grad.addColorStop(0,   SWEEP + '0.0)');
  grad.addColorStop(0.4, SWEEP + (isMob ? '0.22)' : '0.13)'));
  grad.addColorStop(0.8, SWEEP + (isMob ? '0.10)' : '0.04)'));
  grad.addColorStop(1,   SWEEP + '0.0)');
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.arc(0, 0, maxR, -sweepWidth, 0); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(maxR, 0);
  ctx.strokeStyle = isMob ? SWEEP + '0.75)' : SWEEP + '0.55)';
  ctx.lineWidth = isMob ? 2 : 1.5; ctx.stroke();
  ctx.restore();

  // particles
  for (const p of particles) {
    const px = p.x - cx, py = p.y - cy;
    const pA = Math.atan2(py, px);
    const diff = (norm(pA) - norm(angle) + Math.PI * 2) % (Math.PI * 2);
    const lit = diff < 0.25;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (lit ? 2.2 : 1), 0, Math.PI * 2);
    ctx.fillStyle = lit
      ? `rgba(74,158,255,${Math.min(0.85, p.a * 3)})`
      : `rgba(255,255,255,${p.a * 0.35})`;
    ctx.fill();
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
  }

  checkSweep();
  angle += window.innerWidth < 600 ? 0.009 : 0.004;
  requestAnimationFrame(draw);
}

// coord readout
const coordEl = document.getElementById('coord');
function updateCoord() {
  const d = new Date();
  const lat = (d.getSeconds() * 0.0001 + 39.9938).toFixed(4);
  const lon = (d.getSeconds() * 0.0001 + 83.0089).toFixed(4);
  coordEl.textContent = `${lat} N  /  ${lon} W`;
}

// ── draw planet (shared core, used by drawPlanet and storm animator) ──
function drawPlanetOn(c, S) {
  c.clearRect(0, 0, S, S);

  c.save();
  c.beginPath(); c.arc(S/2, S/2, S/2, 0, Math.PI*2); c.clip();

  const base = c.createRadialGradient(S*0.38, S*0.32, 2, S/2, S/2, S/2);
  base.addColorStop(0,   '#2a1450');
  base.addColorStop(0.5, '#150830');
  base.addColorStop(1,   '#08030f');
  c.fillStyle = base; c.fillRect(0, 0, S, S);

  const clouds = [
    { x: 18, y: 20, rx: 16, ry: 10, a: 0.13, col: [140,60,220] },
    { x: 44, y: 14, rx: 14, ry: 8,  a: 0.09, col: [160,80,255] },
    { x: 10, y: 42, rx: 12, ry: 7,  a: 0.10, col: [100,40,180] },
    { x: 46, y: 40, rx: 13, ry: 8,  a: 0.08, col: [180,80,255] },
    { x: 26, y: 52, rx: 15, ry: 7,  a: 0.11, col: [120,50,200] },
  ];
  for (const cl of clouds) {
    const ng = c.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, Math.max(cl.rx, cl.ry));
    ng.addColorStop(0,   `rgba(${cl.col},${cl.a})`);
    ng.addColorStop(1,   `rgba(${cl.col},0)`);
    c.save(); c.scale(1, cl.ry/cl.rx);
    c.beginPath(); c.arc(cl.x, cl.y * (cl.rx/cl.ry), cl.rx, 0, Math.PI*2);
    c.fillStyle = ng; c.fill(); c.restore();
  }

  const bands = [
    { y: 16, h: 5,  a: 0.09, col: [150,70,255] },
    { y: 30, h: 9,  a: 0.06, col: [120,50,200] },
    { y: 46, h: 7,  a: 0.07, col: [170,90,255] },
    { y: 60, h: 10, a: 0.05, col: [100,40,180] },
  ];
  for (const b of bands) {
    c.fillStyle = `rgba(${b.col},${b.a})`;
    c.fillRect(0, b.y, S, b.h);
  }

  const spec = c.createRadialGradient(S*0.3, S*0.26, 0, S*0.36, S*0.33, S*0.32);
  spec.addColorStop(0,   'rgba(230,200,255,0.22)');
  spec.addColorStop(0.5, 'rgba(200,160,255,0.06)');
  spec.addColorStop(1,   'rgba(200,160,255,0)');
  c.fillStyle = spec; c.fillRect(0, 0, S, S);

  const limb = c.createRadialGradient(S/2, S/2, S*0.3, S/2, S/2, S/2);
  limb.addColorStop(0,   'rgba(0,0,0,0)');
  limb.addColorStop(0.7, 'rgba(0,0,0,0.1)');
  limb.addColorStop(1,   'rgba(0,0,0,0.6)');
  c.fillStyle = limb; c.fillRect(0, 0, S, S);

  c.restore();

  const ring = c.createRadialGradient(S/2, S/2, S/2-1, S/2, S/2, S/2+8);
  ring.addColorStop(0,   'rgba(150,70,255,0.45)');
  ring.addColorStop(0.5, 'rgba(120,40,200,0.15)');
  ring.addColorStop(1,   'rgba(120,40,200,0)');
  c.beginPath(); c.arc(S/2, S/2, S/2+4, 0, Math.PI*2);
  c.fillStyle = ring; c.fill();
}

function drawPlanet() {
  const pc = document.getElementById('planet-canvas');
  pc.width = 68; pc.height = 68;
  drawPlanetOn(pc.getContext('2d'), 68);
}
